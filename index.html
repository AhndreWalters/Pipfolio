    <!-- Styles: theme, components and responsive layouts -->
    <style>
      [data-theme='dark'] {
        --bg: #000;
        --bg2: #0a0a0a;
        --card: #0f0f0f;
        --bd: #262626;
        --tx: #ededed;
        --mut: #8a8a8a;
        --ac: #6c96f2;
        --acx: #000;
        --acs: #1a1a1a;
        --pos: #3dc28a;
        --neg: #f06b6b;
        --in: #0a0a0a;
        --hov: #1a1a1a;
        --posbg: #0f2a1f;
        --negbg: #2e1517;
      } /* Page defaults */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--tx);
        min-height: 100vh;
        font-variant-numeric: tabular-nums;
      } /* Headings */
      h1 {
        font-size: 22px;
        line-height: 28px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        font-family: 'Space Grotesk', sans-serif;
        color: var(--tx);
      }
      .logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--ac), #5b86e8);
        color: var(--acx);
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 700;
      } /* Header, navigation and buttons */
      .acts,
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tab {
        border-bottom: 2px solid transparent;
        background: none;
        font: inherit;
        cursor: pointer;
      }
      .tab.on {
        border-color: var(--ac);
      }
      .btn {
        padding: 0 16px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        font: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--hov);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn.primary:hover {
        filter: brightness(1.07);
      }
      .btn.danger {
        color: var(--neg);
      }
      .btn.danger.solid {
        background: var(--neg);
        border-color: var(--neg);
        color: #fff;
      }
      .btn.block {
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 20px;
      }
      .page-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        min-height: 38px;
      } /* Cards and layout */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 16px;
      }
      .stat {
        padding: 16px 20px;
        min-height: 92px;
      }
      .lbl {
        color: var(--mut);
        font-size: 13px;
        line-height: 20px;
      }
      .val {
        font-size: 22px;
        line-height: 32px;
        font-weight: 650;
        margin-top: 4px;
      }
      .sub {
        color: var(--mut);
        font-size: 12px;
        line-height: 16px;
      }
      .pos {
        color: var(--pos);
      }
      .neg {
        color: var(--neg);
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
      }
      .c3 {
        grid-column: span 3;
      }
      .c2 {
        grid-column: span 2;
      }
      .chart {
        height: 240px;
        margin-top: 12px;
        position: relative;
      }
      .chart svg {
        display: block;
      }
      .chart-empty {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--mut);
        text-align: center;
      }
      svg .grid {
        stroke: var(--bd);
        stroke-width: 1;
      }
      svg .zero {
        stroke: var(--mut);
        stroke-width: 1;
      }
      svg .tick {
        fill: var(--mut);
        font-size: 11px;
      }
      svg rect.pos {
        fill: var(--pos);
      }
      svg rect.neg {
        fill: var(--neg);
      }
      svg .ln {
        fill: none;
        stroke: var(--ac);
        stroke-width: 2;
        stroke-linejoin: round;
      }
      svg .dot {
        fill: var(--ac);
      }
      .empty {
        text-align: center;
        padding: 48px 20px;
      }
      .empty p {
        color: var(--mut);
        margin: 4px 0 16px;
      }
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      } /* Forms and filters */
      input,
      select,
      textarea {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        font: inherit;
      }
      textarea {
        height: 96px;
        padding: 8px 12px;
        resize: vertical;
      }
      .filters input {
        flex: 1;
      }
      .filters select {
        width: 160px;
      } /* Tables and trade results */
      .tw {
        overflow-x: auto;
        padding: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid var(--bd);
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.n,
      th.n {
        text-align: right;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover {
        background: var(--hov);
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge.Win {
        color: var(--pos);
      }
      .badge.Loss {
        color: var(--neg);
      }
      .badge.Breakeven {
        color: var(--mut);
      }
      .count {
        color: var(--mut);
        font-size: 13px;
        margin-top: 12px;
      } /* Settings layout */
      .stack {
        display: grid;
        gap: 16px;
        width: 100%;
        max-width: none;
      }
      .stack p {
        color: var(--mut);
        margin: 4px 0 16px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      } /* Dialogs and account access */
      dialog {
        border: 1px solid var(--bd);
        padding: 0;
        background: var(--card);
        color: var(--tx);
        width: min(680px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        margin: auto;
        overflow: hidden;
      }
      dialog[open] {
        display: flex;
        flex-direction: column;
      }
      dialog.sm {
        width: min(440px, calc(100vw - 24px));
      }
      dialog::backdrop {
        background: rgba(10, 14, 20, 0.5);
      }
      .dh {
        padding: 20px 24px;
        border-bottom: 1px solid var(--bd);
      }
      .db {
        padding: 24px;
        overflow-y: auto;
      }
      .df {
        padding: 16px 24px;
        border-top: 1px solid var(--bd);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .df .l {
        margin-right: auto;
      }
      .mp {
        color: var(--mut);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .full {
        grid-column: 1/-1;
      }
      .f {
        display: block;
      }
      .f > span {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .f.bad input,
      .f.bad select {
        border-color: var(--neg);
      }
      .err {
        display: block;
        color: var(--neg);
        font-size: 12px;
        margin-top: 4px;
      }
      .f small.hint {
        display: block;
        color: var(--mut);
        font-size: 12px;
        margin-top: 4px;
      }
      .calc {
        display: grid;
        gap: 16px;
        padding: 12px 16px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--hov);
      }
      .calc b {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }
      .kv {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 24px;
      }
      .kv b {
        display: block;
        font-weight: 600;
        word-break: break-word;
      }
      .notes {
        white-space: pre-wrap;
        padding: 12px 16px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--hov);
      }
      .lock {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .lock .card {
        width: min(400px, 100%);
        padding: 32px;
      }
      .lock form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }
      .lock .brand {
        justify-content: flex-start;
        margin-bottom: 8px;
        text-align: left;
      }
      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        font-size: 13px;
      }
      #toasts {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        gap: 8px;
        z-index: 99;
        width: min(420px, calc(100vw - 24px));
      }
      .toast {
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--tx);
        color: var(--bg);
        font-weight: 500;
      }
      .toast.error {
        background: var(--neg);
        color: #fff;
      } /* Trading accounts */
      .hsel {
        width: 220px;
      }
      .subl {
        color: var(--mut);
      }
      .badge.Open {
        color: var(--ac);
      }
      .calc {
        grid-template-columns: repeat(3, 1fr);
      }
      .sec {
        font-weight: 600;
        padding-top: 16px;
        border-top: 1px solid var(--bd);
      }
      .sec small {
        display: block;
        font-weight: 400;
        color: var(--mut);
        font-size: 12px;
      }
      .accs {
        display: grid;
        gap: 16px;
      }
      .acc {
        border: 1px solid var(--bd);
        border-radius: 10px;
      }
      .acc-h {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .kv4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .kv4 b {
        display: block;
        font-weight: 600;
        color: var(--tx);
      }
      table {
        min-width: 900px;
      } /* Footer */
      .footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--bd);
        color: var(--mut);
        text-align: center;
        font-size: 12px;
      }
      .footer a {
        color: var(--ac);
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      } /* Trading calendar */
      .cal-card {
        margin-bottom: 16px;
      }
      .cal-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .cal-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cal-nav select {
        width: 140px;
      }
      .cal-nav input {
        width: 88px;
      }
      .btn.icon {
        width: 38px;
        padding: 0;
      }
      .cal-sum {
        color: var(--mut);
        margin-bottom: 12px;
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }
      .cal-wd {
        text-align: center;
        color: var(--mut);
        font-size: 12px;
        line-height: 20px;
      }
      .cal-d {
        display: flex;
        flex-direction: column;
        gap: 2px;
        height: 76px;
        min-width: 0;
        padding: 8px;
        overflow: hidden;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .cal-d:hover {
        background: var(--hov);
      }
      .cal-d.pos {
        color: var(--pos);
      }
      .cal-d.neg {
        color: var(--neg);
      }
      .cal-d.be {
        color: var(--mut);
      }
      .cal-d.sel {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      .cal-num {
        color: var(--tx);
        font-size: 13px;
        font-weight: 600;
      }
      .cal-d.today .cal-num {
        color: var(--ac);
        font-weight: 700;
      }
      .cal-v {
        overflow: hidden;
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cal-n {
        overflow: hidden;
        color: var(--mut);
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cal-hint {
        margin-top: 16px;
        color: var(--mut);
      }
      .cal-day {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--bd);
      }
      .cal-day .kv4 {
        margin-top: 16px;
      }
      .cal-day .card {
        margin-top: 16px;
      }
      .wrap {
        margin: auto;
      }
      .wrap main,
      .wrap main > *,
      .wrap .card,
      .wrap .tw {
        min-width: 0;
        max-width: 100%;
      }
      .wrap .tw {
        overflow-x: auto;
      } /* Chart layout */
      .refdash {
        display: grid;
        width: 100%;
        min-width: 0;
      }
      .refdash .ref-top,
      .refdash .ref-mid,
      .refdash .ref-bottom,
      .refdash .ref-legacy,
      .refdash .ref-morecharts {
        display: grid;
        width: 100%;
      }
      .refdash .ref-top {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .refdash .ref-legacy {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .refdash .ref-morecharts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .refdash .ref-card {
        background: var(--card);
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .refdash .ref-title {
        display: flex;
        align-items: center;
        min-width: 0;
        color: var(--mut);
        text-transform: uppercase;
      }
      .refdash .ref-title-text {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .refdash .ref-info {
        appearance: none;
        display: inline-grid;
        place-items: center;
        flex: 0 0 17px;
        width: 17px;
        height: 17px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mut);
        cursor: help;
      }
      .refdash .ref-info svg {
        display: block;
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      .refdash .ref-info:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
        border-radius: 50%;
      }
      .refdash .ref-value {
        margin-top: 10px;
      }
      .refdash .ref-sub {
        font-size: 11px;
        line-height: 1.5;
        color: var(--mut);
        margin-top: 5px;
      }
      .refdash .ref-gauge {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 9px;
        min-width: 0;
      }
      .refdash .ref-gauge svg {
        display: block;
        width: min(52%, 96px);
        height: auto;
        flex: 0 1 auto;
      }
      .refdash .ref-gauge .ref-sub {
        flex: 1 1 0;
        text-align: center;

      /* Trade cards keep every column accessible on phones */
      @media (max-width: 600px) {

          overflow: hidden;

        .trade-table tr {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px 12px;
          margin-bottom: 12px;

          overflow-wrap: anywhere;
          text-align: left;

          color: var(--mut);

        }
        .trade-table td:nth-child(2) {

        }

        }

          order: 3;
          text-align: right;
        }
        .trade-table td:nth-child(4) {
          order: 4;
        }
        .trade-table td:nth-child(5) {
          order: 5;
          text-align: right;
        }
        .trade-table td:nth-child(1) {

      :root, [data-theme='light'] {

,

      const SAMPLE_EMOTIONS = [

      const sampleInfo = () => ({

      function buildSample() {
        const stamp = Date.now();
        let seed = (stamp % 2147483646) + 1;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const between = (a, b) => a + rnd() * (b - a);
        const pick = (list) => list[Math.floor(rnd() * list.length)];
        const today = nowLocal().slice(0, 10);
        const t0 = Date.UTC(+today.slice(0, 4), +today.slice(5, 7) - 1, +today.slice(8, 10));
        const localStr = (ms) => {
          const d = new Date(ms);
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          return d.toISOString().slice(0, 16);
        };
        const have = new Set(S.settings.accounts.map((a) => a.id));
        const batch = stamp.toString(36);
        let n = 0;
        // Regimes create streaks, while rare tail events produce unusually large moves.
        let regime = 0;
        let streakLeft = 0;
        const nextOutcome = () => {
          if (streakLeft-- <= 0) {
            regime = rnd() < 0.5 ? -1 : 1;
            streakLeft = 2 + Math.floor(rnd() * 10);
          }
          const roll = rnd();
          if (roll < 0.07) return 'flat';
          return rnd() < (regime > 0 ? 0.68 : 0.3) ? 'win' : 'loss';
        };
        const make = (a, ago, open) => {
          const inst = pick(SAMPLE_PAIRS);
          const [, from, to] = pick(SAMPLE_SESSIONS);
          const dir = rnd() < 0.5 ? 1 : -1;
          const entry = +(inst.base * (1 + between(-0.01, 0.01))).toFixed(inst.dp);
          const slPips = Math.round(between(...inst.sl));
          const rr = +between(0.6, 5).toFixed(1);
          // Position sizes vary; rare oversized positions magnify both wins and losses.
          const sizeFactor = rnd() < 0.07 ? between(2.5, 5) : between(0.35, 1.8);
          const risk = r2(a.balance * a.risk * sizeFactor);
          const lots = Math.max(0.01, Math.round((risk / (slPips * inst.pv)) * 100) / 100);
          const startMs = t0 - ago * 864e5 + Math.round(between(from, to)) * 6e4;
          const dt = localStr(startMs);
          n++;
          const t = {
            id: `sample-${batch}-${n}`,
            account: a.id,
            dt,
            xdt: '',
            pair: inst.pair,
            side: dir > 0 ? 'Buy' : 'Sell',
            entry,
            sl: +(entry - dir * slPips * inst.pip).toFixed(inst.dp),
            tp: +(entry + dir * slPips * rr * inst.pip).toFixed(inst.dp),
            exit: null,
            lots,
            risk,
            pl: null,
            comm: 0,
            charges: 0,
            adjustment: 0,
            pipSize: inst.pip,
            session: detectSession(dt),
            setup: pick(SAMPLE_SETUPS),
            tf: pick(['M15', 'H1', 'H4']),
            notes: open ? 'Trade still running, stop is in place.' : '',
            psychologyBefore: pick(SAMPLE_EMOTIONS),
            psychologyAfter: '',
            planFollowed: rnd() < 0.76,
            mistakes: [],
            checklistDone: SAMPLE_CHECKLIST.filter(() => rnd() < 0.85),
            screenshots:
              n <= 4 || n % 13 === 0
                ? [SAMPLE_SCREENSHOTS[n % 2], SAMPLE_SCREENSHOTS[(n + 1) % 2]]
                : [],
            sample: true,
            created: stamp + n,
            updated: stamp + n,
          };
          if (!open) {
            const outcome = nextOutcome();
            const shock = rnd();
            let pips;
            if (outcome === 'flat') {
              pips = between(-0.12, 0.12) * slPips;
            } else if (outcome === 'win') {
              // Small wins, full targets, and occasional outsized runners.
              const multiple =
                shock < 0.12
                  ? between(3.5, 8)
                  : shock < 0.5
                    ? between(0.15, 0.85)
                    : between(0.9, 2.6);
              pips = slPips * multiple;
            } else {
              // Stops usually work, but rare gaps/slippage cause large losses.
              const multiple =
                shock < 0.1
                  ? between(3, 7)
                  : shock < 0.3
                    ? between(1.1, 2.3)
                    : shock < 0.48
                      ? between(0.1, 0.7)
                      : between(0.85, 1.1);
              pips = -slPips * multiple;
            }
            t.exit = +(entry + dir * pips * inst.pip).toFixed(inst.dp);
            t.pl = r2(((dir * (t.exit - entry)) / inst.pip) * inst.pv * lots);
            t.comm = r2(lots * between(3, 13));
            t.charges = rnd() < 0.45 ? r2(between(0.2, 5)) : 0;
            t.adjustment = rnd() < 0.12 ? r2(between(-3, 3)) : 0;
            t.xdt = localStr(startMs + Math.round(between(5, 900)) * 6e4);
            t.notes =
              outcome === 'flat'
                ? 'Choppy trade, closed close to breakeven.'
                : outcome === 'loss' && shock < 0.1
                  ? 'Unexpected volatility and slippage caused an unusually large loss.'
                  : outcome === 'win' && shock < 0.12
                    ? 'Unusually strong move; held a runner much longer than expected.'
                    : pick(outcome === 'win' ? SAMPLE_WIN_NOTES : SAMPLE_LOSS_NOTES);
          }
          return clean(t);
        };
        const trades = [];
        for (let ago = 120; ago >= 1; ago--) {
          const wd = new Date(t0 - ago * 864e5).getUTCDay();
          if (wd === 0 || wd === 6 || rnd() < 0.28) continue;
          for (let i = 1 + Math.floor(rnd() * 3); i > 0; i--)
            trades.push(make(pick(SAMPLE_ACCOUNTS), ago, false));
        }
        SAMPLE_ACCOUNTS.forEach((a, i) => trades.push(make(a, 1 + (i % 2), true)));
        // Distribute every review category through closed sample trades.
        const completed = trades.filter((t) => t.xdt);
        completed.forEach((t, i) => {
          if (i < SAMPLE_EMOTIONS.length) t.psychologyBefore = SAMPLE_EMOTIONS[i];
          t.planFollowed = i % 5 !== 0;
          t.psychologyAfter = '';
          t.mistakes = t.planFollowed ? [] : [SAMPLE_MISTAKES[i % SAMPLE_MISTAKES.length]];
          if (i < SAMPLE_CHECKLIST.length) t.checklistDone = SAMPLE_CHECKLIST.slice(0, i + 1);
        });
        // Only create sample accounts that don't exist yet, so clicks never duplicate accounts.
        const accounts = SAMPLE_ACCOUNTS.filter((a) => !have.has(a.id)).map(({ risk, ...a }) =>
          cleanAcc({ ...a, currency: '$', sample: true, created: stamp }),
        );
        return { accounts, trades: trades.filter(Boolean) };
      }
      function sampleCard() {

        <p>${has ? `${info.accounts} example accounts and ${info.trades} example trades loaded.` : 'Try the journal with example trades.'} Removing examples keeps your own trades.</p>

      function tradeTable(fl, total, count = true) {
        if (!fl.length)

            return `<div class="count trade-count-summary"><span>Showing ${fl.length} of ${total} trade${total !== 1 ? 's' : ''}</span><span><strong>Shown Net P&L:</strong> ${summary}</span></div>`;

      function compressTradeImage(file) {
        return new Promise((resolve, reject) => {
          if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
            reject(new Error('Use PNG, JPEG or WebP'));
            return;
          }
          if (file.size > 12 * 1024 * 1024) {
            reject(new Error('Image exceeds 12 MB'));
            return;
          }
          const url = URL.createObjectURL(file),
            img = new Image();
          img.onload = () => {
            try {
              const scale = Math.min(1, 1200 / img.width, 1200 / img.height);
              const c = document.createElement('canvas');
              c.width = Math.max(1, Math.round(img.width * scale));
              c.height = Math.max(1, Math.round(img.height * scale));
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              resolve(c.toDataURL('image/jpeg', 0.68));
            } catch (e) {
              reject(e);
            } finally {
              URL.revokeObjectURL(url);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Invalid image'));
          };
          img.src = url;
        });
      }

            time: csvDt(g('update time')),
            comm: Math.abs(Number(g('commission')) || 0),
            charges: r2(feeCols.reduce((sum, i) => sum + Math.abs(Number(r[i]) || 0), 0)),
            pl: g('closed p&l'),
            netPl: head.includes('net closed p&l')
              ? (r[head.indexOf('net closed p&l')] ?? '').trim()
              : '',
          };
          if (
            o.pl !== '' &&
            (!Number.isFinite(Number(o.pl)) ||
              (o.netPl !== '' && !Number.isFinite(Number(o.netPl))))
          ) {
            badFinancial.push(pid);
            return;
          }
          if (!pos.has(pid)) pos.set(pid, { entries: [], exits: [] });
          pos.get(pid)[o.pl !== '' ? 'exits' : 'entries'].push(o);
        });
        if (badFinancial.length)
          return {
            error:
              'Invalid broker P&L values for position(s): ' + [...new Set(badFinancial)].join(', '),
          };
        const wavg = (a) =>
          +(a.reduce((s, x) => s + x.price * x.qty, 0) / a.reduce((s, x) => s + x.qty, 0)).toFixed(
            5,
          );
        const out = [];
        let skipped = 0,
          stamp = Date.now();
        for (const [pid, p] of pos) {
          if (!p.entries.length) {
            skipped++;
            continue;
          } // opened before this export
          const byTime = (a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
          p.entries.sort(byTime);
          p.exits.sort(byTime);
          const e0 = p.entries[0];
          const lots = r2(p.entries.reduce((s, x) => s + x.qty, 0));
          const entry = wavg(p.entries);
          const d = e0.side === 'Buy' ? 1 : -1;
          const exitQty = p.exits.reduce((s, x) => s + x.qty, 0);
          const done = p.exits.length && exitQty >= lots - 1e-9; // partial close stays open
          const t = {
            id: 'csv-' + pid,
            account: '',
            dt: e0.time,
            xdt: '',
            pair: e0.sym.split('.')[0].toUpperCase(),
            side: e0.side,
            entry,
            sl: null,
            tp: null,
            exit: null,
            lots,
            risk: 0,
            pl: null,
            comm: r2(p.entries.reduce((s, x) => s + x.comm, 0)),
            charges: r2(p.entries.reduce((s, x) => s + x.charges, 0)),
            adjustment: 0,
            pipSize: null,
            session: detectSession(e0.time),
            setup: '',
            tf: '',
            notes: 'Imported from broker CSV (' + pid + ')',
            created: stamp,
            updated: stamp++,
          };
          if (done) {
            const last = p.exits[p.exits.length - 1];
            t.exit = wavg(p.exits);
            t.xdt = last.time;
            t.pl = r2(p.exits.reduce((s, x) => s + Number(x.pl), 0));
            t.comm = r2(t.comm + p.exits.reduce((s, x) => s + x.comm, 0));
            t.charges = r2(t.charges + p.exits.reduce((s, x) => s + x.charges, 0));
            // TradingView net includes broker adjustments not itemized as commission.
            // Preserve the reported net rather than inventing a fee.
            if (p.exits.every((x) => x.netPl !== '' && Number.isFinite(Number(x.netPl)))) {
              const reportedNet = r2(p.exits.reduce((s, x) => s + Number(x.netPl), 0));
              t.adjustment = r2(reportedNet - (t.pl - t.comm - t.charges));
            }
            if (last.type.includes('stop') && d * (entry - t.exit) > 0) t.sl = t.exit;
            if (last.type.includes('take') && d * (t.exit - entry) > 0) t.tp = t.exit;
          }
          const c = clean(t);
          c ? out.push(c) : skipped++;
        }
        reportedBalances.sort((a, b) => a.time.localeCompare(b.time));
        return {
          trades: out,
          skipped,
          reportedBalance: reportedBalances.length
            ? reportedBalances[reportedBalances.length - 1].value
            : null,
        };
      }

          )
            return;
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'info-button chart-pop-target card-info-button';
          b.textContent = 'i';
          b.setAttribute('aria-label', 'About ' + title);
          b.setAttribute('data-chart-title', title);
          b.setAttribute('data-chart-detail', desc);
          if (titleEl) {
            const slot = document.createElement('span');
            slot.className = 'card-info-inline';
            slot.appendChild(b);
            titleEl.appendChild(slot);
          } else {
            card.classList.add('card-info-positioned');
            const slot = document.createElement('span');
            slot.className = 'card-info-floating';
            slot.appendChild(b);
            card.appendChild(slot);
          }
        });
      }
      let cardInfoQueued = false;
      const cardInfoObserver = new MutationObserver(() => {
        if (cardInfoQueued) return;
        cardInfoQueued = true;
        queueMicrotask(() => {
          cardInfoQueued = false;
          addCardInfo();
        });
      });
      cardInfoObserver.observe(document.getElementById('app'), { childList: true, subtree: true });
      addCardInfo();


      // Harmonise heading capitalisation throughout the app without changing trade data.
      function harmoniseHeadings() {
        const acronyms = new Set(['P&L','ROI','RR','R:R','USD','TP','SL','ID','CSV','FX','API','DOM']);
        document.querySelectorAll('#app h1, #app h2, #app h3, #app h4, #app .ref-title-text, #app .simple-label, #app .settings-field-title').forEach(el => {
          const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (!node.nodeValue.trim()) continue;
            const formatted = node.nodeValue.replace(/\b[A-Za-z][A-Za-z&:]*\b/g, word => {
              if (acronyms.has(word.toUpperCase())) return word.toUpperCase();
              return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            });
            if (formatted !== node.nodeValue) node.nodeValue = formatted;
          }
        });
      }
      let headingsQueued = false;
      new MutationObserver(() => {
        if (headingsQueued) return;
        headingsQueued = true;
        queueMicrotask(() => {headingsQueued = false; harmoniseHeadings();});
      }).observe(document.getElementById('app'), {childList:true,subtree:true});
      harmoniseHeadings();
      document.addEventListener('input', e => { if (e.target.id === 'custom-accent') { const label = document.querySelector('.custom-accent-value'); if (label) label.textContent = e.target.value.toUpperCase(); } });

      // Keep every visible Recent Trades row whole, even as calendar details expand.
      // The row height is distributed evenly across the available list viewport.
      let recentRowResizeObserver = null;
      let observedRecentList = null;
      function fitRecentTradeRows() {
        const list = document.querySelector('.dashboard-calendar-row .simple-recent');
        if (list === observedRecentList) return;
        if (recentRowResizeObserver) recentRowResizeObserver.disconnect();
        observedRecentList = list;
        if (!list || !window.ResizeObserver) return;
        recentRowResizeObserver = new ResizeObserver(() => {
          const available = list.clientHeight;
          if (!available) return;
          const minRow = 58;
          const count = Math.max(1, Math.floor(available / minRow));
          const rowHeight = available / count;
          list.style.setProperty('--recent-trade-row-height', `${rowHeight}px`);
        });
        recentRowResizeObserver.observe(list);
      }
      const recentListMutationObserver = new MutationObserver(fitRecentTradeRows);
      recentListMutationObserver.observe(document.getElementById('app'), {childList:true, subtree:true});
      fitRecentTradeRows();
      // Start
      dlg.addEventListener('cancel', (event) => {
        if (saving) event.preventDefault();
      });
      window.addEventListener('beforeunload', (event) => {
        if (saving) {
          event.preventDefault();
          event.returnValue = '';
        }
      });
      startCloud();

      // Shared tooltip portal: keeps every card's help text visible even when
      // the card, dashboard grid or viewport edge clips its original tooltip.
      (() => {
        const floating = document.createElement('div');
        floating.className = 'pf-floating-info';
        floating.setAttribute('role', 'tooltip');
        floating.hidden = true;
        document.body.appendChild(floating);
        let activeButton = null;
        const hide = () => { floating.hidden = true; activeButton = null; };
        const show = (button) => {
          const tip = button.closest('.info-wrap')?.querySelector('.info-tooltip');
          if (!tip) return;
          activeButton = button;
          floating.textContent = tip.textContent.trim();
          floating.hidden = false;
          floating.style.left = '0px';
          floating.style.top = '0px';
          const rect = button.getBoundingClientRect();
          const box = floating.getBoundingClientRect();
          const margin = 10;
          const left = Math.max(margin, Math.min(window.innerWidth - box.width - margin, rect.left + rect.width / 2 - box.width / 2));
          let top = rect.bottom + 9;
          if (top + box.height > window.innerHeight - margin) top = rect.top - box.height - 9;
          top = Math.max(margin, Math.min(window.innerHeight - box.height - margin, top));
          floating.style.left = left + 'px';
          floating.style.top = top + 'px';
        };
        document.addEventListener('pointerover', (event) => {
          const button = event.target.closest?.('.info-wrap > .info-button');
          if (button && button !== activeButton) show(button);
        });
        document.addEventListener('pointerout', (event) => {
          if (activeButton && event.target.closest?.('.info-wrap') &&
              !event.target.closest('.info-wrap').contains(event.relatedTarget)) hide();
        });
        document.addEventListener('focusin', (event) => {
          const button = event.target.closest?.('.info-wrap > .info-button');
          if (button) show(button);
        });
        document.addEventListener('focusout', (event) => {
          if (activeButton && event.target === activeButton) hide();
        });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') hide(); });
        window.addEventListener('scroll', hide, true);
        window.addEventListener('resize', hide);
      })();

    </script>
  </body>
</html>
