/* Unified card geometry and type scale. One source of truth for all dashboard rows. */
:root{--card-border-width:3px;--card-radius:14px;--card-gap:16px;--card-padding:18px;--text-caption:12px;--text-body:14px;--text-label:13px;--text-heading:16px;--text-metric:24px}
.card,.refdash .ref-card,.acc{box-sizing:border-box;border:var(--card-border-width) solid var(--bd);border-radius:var(--card-radius);background:var(--card)}
.refdash{--dash-gap:var(--card-gap);--dash-pad:var(--card-padding);gap:var(--card-gap)}
.refdash .ref-top,.refdash .ref-mid,.refdash .ref-bottom,.refdash .ref-legacy,.refdash .ref-morecharts{gap:var(--card-gap);align-items:stretch;min-width:0}
.refdash .ref-card{box-sizing:border-box;min-width:0;width:100%;margin:0;padding:var(--card-padding);border:var(--card-border-width) solid var(--bd);border-radius:var(--card-radius)}
.refdash .ref-mid{grid-template-columns:repeat(3,minmax(0,1fr))}
.refdash .ref-mid>.ref-card{height:clamp(430px,38vw,560px);min-height:0}
.refdash .ref-mid>.ref-combined{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:var(--card-gap)}
.refdash .ref-combined-section{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.refdash .ref-combined-section+.ref-combined-section{border-top:2px solid var(--bd);padding-top:var(--card-gap)}
.refdash .ref-combined-section .ref-title{flex:0 0 auto}
.refdash .ref-combined-section .ref-plot{flex:1 1 0;height:0;min-height:0;margin-top:8px}
.refdash .ref-mid .ref-plot{min-width:0;overflow:hidden;margin-top:10px}
.refdash .ref-bottom{align-items:stretch}
.refdash .ref-activity-card{min-height:0}
/* Typography by role: all matching text elements share exactly the same sizes. */
.refdash .ref-title{font-size:var(--text-label);line-height:1.4;letter-spacing:.3px;gap:8px;overflow-wrap:anywhere}
.refdash .ref-value{font-size:clamp(19px,1.7vw,var(--text-metric));line-height:1.3}
.refdash .ref-sub,.lbl,.count,.cal-sum,.cal-hint{font-size:var(--text-caption);line-height:1.5}
.refdash .ref-activity-row{font-size:var(--text-body);line-height:1.45;padding:7px 2px}
.refdash .ref-chip,.refdash .ref-activity-date{font-size:var(--text-caption);line-height:1.4}
.refdash .ref-chip{padding:3px 8px}
.refdash .ref-legacy .ref-value{font-size:20px}
h2,.page-h h2{font-size:var(--text-heading)}
.f>span,th,.cal-num,.cal-v{font-size:var(--text-label)}
.refdash .ref-top,.refdash .ref-mid,.refdash .ref-bottom,.refdash .ref-legacy,.refdash .ref-morecharts{row-gap:var(--card-gap);column-gap:var(--card-gap)}
@media(max-width:620px){.refdash .ref-mid>.ref-card{height:430px}.refdash .ref-title{font-size:var(--text-label)}.refdash .ref-info{flex-shrink:0}}

.brand-mark{display:inline-grid;place-items:center;flex:none;width:35px;height:35px;border-radius:9px;background:#3565df;color:#fff;font-size:26px;font-weight:750;line-height:1}

.accent-picker-label{display:block;margin-top:17px;font-size:13px;font-weight:700;color:var(--tx)}
.accent-note{font-size:12px;color:var(--mut);margin-top:9px}
.btn.primary,[data-theme=dark] .btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.primary:hover,[data-theme=dark] .btn.primary:hover{background:var(--ac);filter:brightness(.91)}
.trades-title{display:inline-flex;align-items:center;gap:10px}
.trades-title .info-wrap{font-variant:normal;text-transform:none;letter-spacing:normal}

/* Trades table: header flush to card edge, without an information icon. */
.card.tw{padding:0;overflow-x:auto;}
.card.tw table{margin:0;}

/* Dashboard quote: oversized accent-colored quotation marks and text. */
.dashboard-quote{display:flex;align-items:center;gap:9px;color:var(--ac)!important;max-width:100%;line-height:1.4;font-weight:650}
.dashboard-quote-text{min-width:0;overflow-wrap:anywhere}
.dashboard-quote-mark{color:var(--ac);font-family:Georgia,serif;font-size:clamp(22px,2.6vw,30px);font-weight:800;line-height:.8;flex-shrink:0}

/* Compact performance cards inspired by the reference layout */
.kpi-stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
.kpi-card{min-height:145px;padding:16px!important;border-radius:14px!important;display:flex;flex-direction:column;justify-content:flex-start}
.kpi-card .simple-stat-head{margin-bottom:12px;min-height:22px}
.kpi-card .simple-label{font-size:12px;letter-spacing:.065em;text-transform:uppercase;font-variant:normal}
.kpi-card .simple-value{font-size:clamp(19px,2vw,27px);margin:4px 0 5px}
.kpi-card .simple-sub{font-size:11px;line-height:1.4}
.kpi-content{min-width:0}
.kpi-gauge{width:115px;max-width:65%;position:relative;flex-shrink:0}
.kpi-gauge svg{width:100%;display:block}
.kpi-gauge strong{position:absolute;bottom:5px;left:0;width:100%;text-align:center;font-size:18px}
.kpi-card:has(.kpi-gauge) .kpi-content{display:flex;align-items:center;justify-content:space-between;gap:7px}
.kpi-gauge-side{font-size:12px;color:var(--mut);line-height:1.5;text-align:right;white-space:nowrap}
.kpi-ratio{margin-top:5px}
.kpi-ratio-track{height:6px;background:var(--neg);border-radius:10px;overflow:hidden}
.kpi-ratio-track span{display:block;height:100%;background:var(--pos);border-radius:10px}
.kpi-ratio-labels{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:10px;margin-top:7px}
@media(max-width:1150px){.kpi-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:680px){.kpi-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:390px){.kpi-stats{grid-template-columns:1fr}}

const CH = 240,

const niceStep = (x) => {
    const p = 10 ** Math.floor(Math.log10(x)),

function axis(min, max) {

    hi = Math.ceil(max / st) * st,
    ticks = [];

    return { lo, hi: ticks[ticks.length - 1], ticks };

    y,
    g: ax.ticks

        (v) =>
            `<line class="grid" x1="${M.l}" x2="${w - M.r}" y1="${y(v)}" y2="${y(v)}"/>

function dayPanel(key, days) {
    const e = days.get(key) || { net: 0, closed: [], open: [] };
    const rows = [...e.closed, ...e.open].sort((a, b) =>

    );
    const weekday = DAY_NAMES[new Date(`${key}T00:00:00Z`).getUTCDay()];
    const head = `<div class="cal-day"><h2>${key} \u00b7 ${weekday}</h2>`;
    if (!rows.length)
    return `${head}<p class="mp">No trades on this day.</p></div>`;
    const n = e.closed.length;
    const wins = e.closed.filter((x) => x.res === 'Win').length;
    const losses = e.closed.filter((x) => x.res === 'Loss').length;
    const nets = e.closed.map((x) => x.net);
    const pips =
    Math.round(e.closed.reduce((t, x) => t + (x.pips ?? 0), 0) * 10) / 10;
    const comm = r2(e.closed.reduce((t, x) => t + x.t.comm, 0));
    const dash = '\u2014';
    const tone = (v, text) => `<span class="${cls(v)}">${text}</span>`;
    const kv = [
    ['Daily P&L', n ? tone(e.net, fm(e.net, 1)) : dash],
    ['Closed trades', n],
    ['Wins / losses', `${wins} / ${losses}`],
    ['Win rate', n ? ((wins / n) * 100).toFixed(1) + '%' : dash],
    ['Best trade', n ? tone(Math.max(...nets), fm(Math.max(...nets), 1)) : dash],
    ['Worst trade', n ? tone(Math.min(...nets), fm(Math.min(...nets), 1)) : dash],
    ['Total pips', n ? tone(pips, pips) : dash],
    ['Commission', n ? fm(comm) : dash],
    ];
    const open = e.open.length
    ? `<p class="sub" style="margin-top:12px">${e.open.length} trade${e.open.length > 1 ? 's' : ''}
        opened on this day ${e.open.length > 1 ? 'are' : 'is'} still open and not
        counted in the daily result.</p>`
    : '';
    return `${head}<div class="kv4">${kv
    .map(([k, v]) => `<div class="lbl">${k}<b>${v}</b></div>`)
    .join('')}</div>${open}${tradeTable(rows, rows.length, false)}</div>`;

    c ? out.push(c) : skipped++;
    }
    reportedBalances.sort((a, b) => a.time.localeCompare(b.time));
    return { trades: out, skipped, reportedBalance: reportedBalances.length ? reportedBalances[reportedBalances.length - 1].value : null }; 
}
async function importCsv(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024)
    return toast('CSV import failed: file is larger than 5 MB.', 'error');
    let res;
    try { res = csvTrades(await file.text()); }
    catch { return toast('CSV import failed: unable to read the file.', 'error'); }
    if (res.error) return toast('CSV import failed: ' + res.error, 'error');
    const have = new Set(S.trades.map((t) => t.id));
    const fresh = res.trades.filter((t) => {
        if (have.has(t.id)) return false;
        have.add(t.id);
        return true;
    });
    const dup = res.trades.length - fresh.length;
    if (!fresh.length)
    return toast(dup ? 'These trades are already imported.' : 'No trades found in this CSV.', 'error');
    const def = acc(S.lastAcc) ? S.lastAcc : S.settings.accounts[0].id;
    const balanceNotice = res.reportedBalance == null
        ? 'No broker account balance column detected. Existing starting balance will be kept.'
        : 'Broker-reported ending balance: ' + fm(res.reportedBalance, false, '') + '. You may reconcile the account balance using this value.';
    openDlg(
    `<div class="dh"><h2>Import broker CSV</h2></div><div class="db">
        <p class="mp" style="margin-bottom:16px">${fresh.length} new trade${fresh.length > 1 ? 's' : ''} found${dup ? `, ${dup} already imported` : ''}${res.skipped ? `, ${res.skipped} skipped` : ''}.</p>
        <p class="mp" style="margin-bottom:12px">${esc(balanceNotice)}</p>
        <label class="f"><span>Import into account</span><select id="csvacc">${S.settings.accounts
        .map((a) => `<option value="${esc(a.id)}" ${a.id === def ? 'selected' : ''}>${esc(a.name)} (${a.type})</option>`)
        .join('')}</select></label>
        ${res.reportedBalance == null ? '' : '<label style="display:block;margin-top:12px"><input type="checkbox" id="csvbalance" style="width:auto;height:auto"> Reconcile account to broker-reported balance (only if this is the latest balance)</label>'}</div>
        <div class="df"><button class="btn" data-act="close">Cancel</button>
        <button class="btn primary" id="csvgo">Import</button></div>`,
    'sm',
    );
    $('#csvgo').onclick = () => {
    const a = $('#csvacc').value;
    const updatedTrades = [...S.trades, ...fresh.map((t) => ({ ...t, account: a }))];
    let settings = S.settings;
    if (res.reportedBalance != null && $('#csvbalance')?.checked) {
        const accountNet = r2(updatedTrades.filter((t) => t.account === a && closed(t)).reduce((sum, t) => sum + calc(t).net, 0));
        settings = { ...S.settings, accounts: S.settings.accounts.map((x) => x.id === a
            ? { ...x, balance: r2(res.reportedBalance - accountNet - flowNet(x)) } : x) };
        if (settings.accounts.some((x) => x.id === a && x.balance < 0))
            return toast('Reconciliation would require a negative starting balance. Check account history.', 'error');
    }
    if (commit(updatedTrades, settings)) {
        S.lastAcc = a;
        closeDlg();
        toast(`Imported ${fresh.length} trade${fresh.length > 1 ? 's' : ''}`);
        render();
    }
    };
}

function flowForm(id, type) {

    `<div class="dh"><h2>${type} \u00b7 ${esc(a.name)}</h2></div>

    ${F('amount', 'Amount (' + esc(a.currency) + ')', nin('amount', '', '0.00'))}

    <button class="btn primary">Save ${type.toLowerCase()}</button></div></form>`,
    'sm',
    );
    $('#ff').onsubmit = (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target),
        g = (n) => String(f.get(n) || '').trim(),
        er = {},
        amt = Number(g('amount'));

    const flow = { id: uid(), type, date: g('date'), amount: amt, note: g('note').slice(0, 100) };
    const st = {
        accounts: S.settings.accounts.map((x) =>
        x.id === id ? { ...x, flows: [...(x.flows || []), flow] } : x,
        ),
    };
    if (commit(S.trades, st)) {
        closeDlg();
        toast(type + ' added');
        render();
    }
    };
}

function addCardInfo(){
 const root=document.querySelector('#app');if(!root)return;
 root.querySelectorAll('.card, .ref-card, .acc').forEach(card=>{
   if(card.matches('.tw') && card.querySelector('table'))return;
   if(card.closest('.lock'))return;
   if(card.matches('.acc') && card.querySelector('.account-type-info'))return;
   if(card.querySelector(':scope > .card-info-floating'))return;
   const titleEl=card.querySelector('.simple-panel-title h2, .ref-title, .cal-h h2, .page-h h2, :scope > h2, :scope > h3, .acc-h h2, .acc-h h3, .simple-label');
   const raw=(titleEl?.textContent||'').replace(/\s+/g,' ').trim();
   const title=raw|| (card.matches('.acc')?'Trading Account':card.querySelector('table')?'Trades Table':'Journal Card');
   const key=title.toLowerCase().replace(/\s+/g,' ').trim();
   const desc=cardHelpDescriptions[key] || (card.querySelector('table')?'Lists recorded trades and their details. Use the available controls to inspect or manage entries.':card.matches('.acc')?'Displays the account details and related controls for this trading account.':`Explains the ${title.toLowerCase()} section and the trading information shown in this card.`);
   // Do not duplicate the existing circular information control on metric cards or the calendar.
   if(titleEl?.closest('.simple-stat-head')?.querySelector('.info-button') || titleEl?.querySelector('.info-button') || (titleEl?.parentElement?.querySelector('.info-button')))return;
   const b=document.createElement('button');b.type='button';b.className='info-button chart-pop-target card-info-button';b.textContent='i';
   b.setAttribute('aria-label','About '+title);b.setAttribute('data-chart-title',title);b.setAttribute('data-chart-detail',desc);
   if(titleEl){
     const slot=document.createElement('span');slot.className='card-info-inline';slot.appendChild(b);titleEl.appendChild(slot);
   }else{
     card.classList.add('card-info-positioned');
     const slot=document.createElement('span');slot.className='card-info-floating';slot.appendChild(b);card.appendChild(slot);
   }
 });
}
