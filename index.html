<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pipfolio</title>
    <link rel="icon" type="image/png" href="./money.png" />
    <style>
      :root {
        --bg: #f6f7f9;
        --bg2: #eceff4;
        --card: #fff;
        --bd: #e2e5ea;
        --tx: #1a2230;
        --mut: #667085;
        --ac: #2f5fd0;
        --acx: #fff;
        --acs: #eaf0fd;
        --pos: #1a9a5f;
        --neg: #d04444;
        --in: #fff;
        --hov: #f3f5f8;
      }
      [data-theme='dark'] {
        --bg: #0e1218;
        --bg2: #141a24;
        --card: #171d27;
        --bd: #262e3a;
        --tx: #e7eaf0;
        --mut: #8b95a5;
        --ac: #6c96f2;
        --acx: #0e1218;
        --acs: #1c2740;
        --pos: #3dc28a;
        --neg: #f06b6b;
        --in: #10151d;
        --hov: #1d2531;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--tx);
        background: var(--bg)
          linear-gradient(180deg, var(--bg2), var(--bg) 360px) no-repeat;
        min-height: 100vh;
        font-variant-numeric: tabular-nums;
      }
      h1 {
        font-size: 22px;
        line-height: 28px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -1px;
        color: var(--tx);
      }
      .logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--ac), #5b86e8);
        color: var(--acx);
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 700;
      }
      .acts,
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--bd);
        margin-bottom: 24px;
      }
      .tab {
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--mut);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .tab.on {
        color: var(--ac);
        border-color: var(--ac);
      }
      .btn {
        height: 38px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--hov);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn.primary {
        background: var(--ac);
        border-color: var(--ac);
        color: var(--acx);
      }
      .btn.primary:hover {
        filter: brightness(1.07);
      }
      .btn.danger {
        color: var(--neg);
      }
      .btn.danger.solid {
        background: var(--neg);
        border-color: var(--neg);
        color: #fff;
      }
      .btn.block {
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 20px;
      }
      .page-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        min-height: 38px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 16px;
      }
      .stat {
        padding: 16px 20px;
        min-height: 92px;
      }
      .lbl {
        color: var(--mut);
        font-size: 13px;
        line-height: 20px;
      }
      .val {
        font-size: 22px;
        line-height: 32px;
        font-weight: 650;
        margin-top: 4px;
      }
      .sub {
        color: var(--mut);
        font-size: 12px;
        line-height: 16px;
      }
      .pos {
        color: var(--pos);
      }
      .neg {
        color: var(--neg);
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
      }
      .c3 {
        grid-column: span 3;
      }
      .c2 {
        grid-column: span 2;
      }
      .chart {
        height: 240px;
        margin-top: 12px;
        position: relative;
      }
      .chart svg {
        display: block;
      }
      .chart-empty {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--mut);
        text-align: center;
      }
      svg .grid {
        stroke: var(--bd);
        stroke-width: 1;
      }
      svg .zero {
        stroke: var(--mut);
        stroke-width: 1;
      }
      svg .tick {
        fill: var(--mut);
        font-size: 11px;
      }
      svg rect.pos {
        fill: var(--pos);
      }
      svg rect.neg {
        fill: var(--neg);
      }
      svg .ln {
        fill: none;
        stroke: var(--ac);
        stroke-width: 2;
        stroke-linejoin: round;
      }
      svg .dot {
        fill: var(--ac);
      }
      .empty {
        text-align: center;
        padding: 48px 20px;
      }
      .empty p {
        color: var(--mut);
        margin: 4px 0 16px;
      }
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input,
      select,
      textarea {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--in);
        color: var(--tx);
        font: inherit;
      }
      textarea {
        height: 96px;
        padding: 8px 12px;
        resize: vertical;
      }
      .filters input {
        flex: 1;
      }
      .filters select {
        width: 160px;
      }
      .tw {
        overflow-x: auto;
        padding: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }
      th,
      td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--bd);
        white-space: nowrap;
      }
      th {
        color: var(--mut);
        font-weight: 500;
        font-size: 13px;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.n,
      th.n {
        text-align: right;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover {
        background: var(--hov);
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        background: var(--hov);
      }
      .badge.Win {
        color: var(--pos);
      }
      .badge.Loss {
        color: var(--neg);
      }
      .badge.Breakeven {
        color: var(--mut);
      }
      .count {
        color: var(--mut);
        font-size: 13px;
        margin-top: 12px;
      }
      .stack {
        display: grid;
        gap: 16px;
        width: 100%;
        max-width: none;
      }
      .stack p {
        color: var(--mut);
        margin: 4px 0 16px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      dialog {
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 0;
        background: var(--card);
        color: var(--tx);
        width: min(680px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        margin: auto;
        overflow: hidden;
      }
      dialog[open] {
        display: flex;
        flex-direction: column;
      }
      dialog.sm {
        width: min(440px, calc(100vw - 24px));
      }
      dialog::backdrop {
        background: rgba(10, 14, 20, 0.5);
      }
      .dh {
        padding: 20px 24px;
        border-bottom: 1px solid var(--bd);
      }
      .db {
        padding: 24px;
        overflow-y: auto;
      }
      .df {
        padding: 16px 24px;
        border-top: 1px solid var(--bd);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .df .l {
        margin-right: auto;
      }
      .mp {
        color: var(--mut);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .full {
        grid-column: 1/-1;
      }
      .f {
        display: block;
      }
      .f > span {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .f.bad input,
      .f.bad select {
        border-color: var(--neg);
      }
      .err {
        display: block;
        color: var(--neg);
        font-size: 12px;
        margin-top: 4px;
      }
      .f small.hint {
        display: block;
        color: var(--mut);
        font-size: 12px;
        margin-top: 4px;
      }
      .calc {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 12px 16px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--hov);
      }
      .calc b {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }
      .kv {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 24px;
      }
      .kv b {
        display: block;
        font-weight: 600;
        word-break: break-word;
      }
      .notes {
        white-space: pre-wrap;
        padding: 12px 16px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--hov);
      }
      .lock {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .lock .card {
        width: min(400px, 100%);
        padding: 32px;
      }
      .lock form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }
      .lock .brand {
        justify-content: flex-start;
        margin-bottom: 8px;
        text-align: left;
      }
      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        font-size: 13px;
      }
      #toasts {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        gap: 8px;
        z-index: 99;
        width: min(420px, calc(100vw - 24px));
      }
      .toast {
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--tx);
        color: var(--bg);
        font-weight: 500;
      }
      .toast.error {
        background: var(--neg);
        color: #fff;
      }
      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .c3,
        .c2 {
          grid-column: 1/-1;
        }
        .kv {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 600px) {
        .top {
          flex-wrap: wrap;
        }
        .grid2,
        .two {
          grid-template-columns: 1fr;
        }
        .calc {
          grid-template-columns: 1fr 1fr;
        }
        .filters {
          flex-direction: column;
        }
        .filters select {
          width: 100%;
        }
        .stat {
          padding: 16px;
        }
        .val {
          font-size: 20px;
        }
        .page-h {
          flex-wrap: wrap;
        }
        .dh,
        .db,
        .df {
          padding-left: 16px;
          padding-right: 16px;
        }
        .df {
          flex-wrap: wrap;
        }
      }
      .hsel {
        width: 220px;
      }
      .subl {
        margin: -8px 0 16px;
        color: var(--mut);
      }
      .badge.Open {
        color: var(--ac);
      }
      .calc {
        grid-template-columns: repeat(3, 1fr);
      }
      .sec {
        font-weight: 600;
        padding-top: 16px;
        border-top: 1px solid var(--bd);
      }
      .sec small {
        display: block;
        font-weight: 400;
        color: var(--mut);
        font-size: 12px;
      }
      .accs {
        display: grid;
        gap: 16px;
      }
      .acc {
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 16px;
      }
      .acc-h {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .kv4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .kv4 b {
        display: block;
        font-weight: 600;
        color: var(--tx);
      }
      table {
        min-width: 900px;
      }
      @media (max-width: 900px) {
        .kv4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .calc {
          grid-template-columns: 1fr 1fr;
        }
        .hsel {
          width: 100%;
        }
        .acc-h .row {
          width: 100%;
        }
      }
      .footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--bd);
        color: var(--mut);
        text-align: center;
        font-size: 12px;
      }
      .footer a {
        color: var(--ac);
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="padding: 24px">Pipfolio needs JavaScript enabled.</p>
    </noscript>
    <div id="app"></div>
    <dialog id="dlg"></dialog>
    <div id="toasts" role="status"></div>
    <input type="file" id="file" accept=".json,application/json" hidden />
    <script>
      'use strict';
      const K = {
        data: 'pipfolio:v1',
        auth: 'pipfolio:auth',
        theme: 'pipfolio:theme',
      };
      const SIDES = ['Buy', 'Sell'],
        SESS = ['Asian', 'London', 'New York', 'London/NY Overlap', 'Other'],
        ITER = 200000;
      const S = {
        trades: [],
        settings: { accounts: [] },
        view: 'dashboard',
        acc: 'all',
        tacc: 'all',
        lastAcc: '',
        q: '',
        res: 'all',
        importMode: 'main',
      };
      const $ = (s, r = document) => r.querySelector(s);
      const app = $('#app'),
        dlg = $('#dlg');
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
      const ls = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
            return true;
          } catch {
            return false;
          }
        },
        del(k) {
          try {
            localStorage.removeItem(k);
          } catch {}
        },
      };
      function toast(m, type = '') {
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = m;
        $('#toasts').append(t);
        setTimeout(() => t.remove(), type ? 5000 : 3000);
      }
      function setTheme(t, save = true) {
        document.documentElement.dataset.theme = t;
        if (save) ls.set(K.theme, t);
      }
      setTheme(
        ls.get(K.theme) ||
          (matchMedia('(prefers-color-scheme:dark)').matches
            ? 'dark'
            : 'light'),
        false,
      );

      /* ---------- password ---------- */
      const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
      const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      async function derive(pw, salt, iter = ITER) {
        const k = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(pw),
          'PBKDF2',
          false,
          ['deriveBits'],
        );
        return b64(
          await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
            k,
            256,
          ),
        );
      }
      async function makeAuth(pw) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        return { salt: b64(salt), hash: await derive(pw, salt), iter: ITER };
      }
      const goodAuth = (a) =>
        a &&
        typeof a.salt === 'string' &&
        typeof a.hash === 'string' &&
        Number.isInteger(a.iter) &&
        a.iter >= 1000 &&
        a.iter <= 2e6;
      function getAuth() {
        try {
          const a = JSON.parse(ls.get(K.auth));
          return goodAuth(a) ? a : null;
        } catch {
          return null;
        }
      }
      const checkPw = async (pw, a) =>
        (await derive(pw, unb64(a.salt), a.iter)) === a.hash;

      /* ---------- data ---------- */
      const defPip = (p) =>
        /JPY/.test(p) ? 0.01 : /XAU|GOLD/.test(p) ? 0.1 : 0.0001;
      const num = (v) =>
        v === '' || v == null ? null : Number.isFinite(+v) ? +v : NaN;
      const ACCT = ['Demo', 'Live', 'Prop Firm', 'Other'];
      const ms = (s) =>
        Date.UTC(
          +s.slice(0, 4),
          +s.slice(5, 7) - 1,
          +s.slice(8, 10),
          +s.slice(11, 13),
          +s.slice(14, 16),
        );
      const okDt = (s) =>
        /^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(s) &&
        new Date(ms(s)).toISOString().slice(0, 16) === s;
      const dur = (a, b) => {
        let m = Math.round((ms(b) - ms(a)) / 6e4);
        const d = Math.floor(m / 1440),
          h = Math.floor((m % 1440) / 60);
        m %= 60;
        return [d && d + 'd', (d || h) && h + 'h', m + 'm']
          .filter(Boolean)
          .join(' ');
      };
      const fdt = (s) => (s ? s.replace('T', ' ') : '\u2014');
      function cleanAcc(a) {
        if (!a || typeof a !== 'object') return null;
        const b = Number(a.balance),
          o = {
            id: String(a.id || ''),
            name: String(a.name || '')
              .trim()
              .slice(0, 40),
            balance: b,
            currency: String(a.currency || '')
              .trim()
              .slice(0, 3),
            broker: String(a.broker || '')
              .trim()
              .slice(0, 40),
            type: ACCT.includes(a.type) ? a.type : 'Other',
            created: Number(a.created) || Date.now(),
          };
        return o.id && o.name && o.currency && Number.isFinite(b) && b >= 0
          ? o
          : null;
      }
      function cleanSettings(s) {
        s = s && typeof s === 'object' ? s : {};
        const seen = new Set(),
          acc = (Array.isArray(s.accounts) ? s.accounts : [])
            .map(cleanAcc)
            .filter((a) => a && !seen.has(a.id) && seen.add(a.id));
        if (!acc.length) {
          const b = Number(s.startBalance);
          acc.push({
            id: 'acc-default',
            name: 'Main account',
            balance: Number.isFinite(b) && b >= 0 ? b : 0,
            currency: String(s.currency || '$').slice(0, 3) || '$',
            broker: '',
            type: 'Other',
            created: Date.now(),
          });
        }
        return { accounts: acc };
      }
      function norm(trades, st) {
        const fb = (
          st.accounts.find((a) => a.id === 'acc-default') || st.accounts[0]
        ).id;
        return trades.map((t) =>
          st.accounts.some((a) => a.id === t.account)
            ? t
            : { ...t, account: fb },
        );
      }
      function clean(t) {
        if (!t || typeof t !== 'object') return null;
        const legacy =
          !('xdt' in t) &&
          t.exit != null &&
          t.exit !== '' &&
          t.pl != null &&
          t.pl !== '';
        const o = {
          id: String(t.id || ''),
          account: String(t.account || ''),
          dt: String(t.dt || '').slice(0, 16),
          xdt: String(legacy ? t.dt : t.xdt || '').slice(0, 16),
          pair: String(t.pair || '')
            .trim()
            .toUpperCase()
            .slice(0, 20),
          side: t.side,
          entry: num(t.entry),
          sl: num(t.sl),
          tp: num(t.tp),
          exit: num(t.exit),
          lots: num(t.lots),
          risk: num(t.risk) ?? 0,
          pl: num(t.pl),
          comm: num(t.comm) ?? 0,
          pipSize: num(t.pipSize),
          session: SESS.includes(t.session) ? t.session : 'Other',
          setup: String(t.setup || '')
            .trim()
            .slice(0, 100),
          tf: String(t.tf || '')
            .trim()
            .slice(0, 20),
          notes: String(t.notes || '').slice(0, 5000),
          created: Number(t.created) || Date.now(),
          updated: Number(t.updated) || Date.now(),
        };
        if (!o.id || !okDt(o.dt) || !o.pair || !SIDES.includes(o.side))
          return null;
        if (o.xdt && (!okDt(o.xdt) || o.xdt < o.dt)) return null;
        for (const k of ['entry', 'lots'])
          if (o[k] == null || isNaN(o[k])) return null;
        for (const k of ['sl', 'tp', 'risk', 'comm', 'exit', 'pl'])
          if (isNaN(o[k])) return null;
        if (
          !(o.entry > 0 && o.lots > 0) ||
          (o.exit != null && o.exit <= 0) ||
          o.risk < 0 ||
          o.comm < 0
        )
          return null;
        if (!(o.pipSize > 0)) o.pipSize = defPip(o.pair);
        return o;
      }
      function load() {
        const raw = ls.get(K.data);
        S.settings = cleanSettings();
        S.trades = [];
        S.acc = S.tacc = 'all';
        if (!raw) return;
        try {
          const d = JSON.parse(raw);
          S.settings = cleanSettings(d.settings);
          S.trades = norm(
            (Array.isArray(d.trades) ? d.trades : [])
              .map(clean)
              .filter(Boolean),
            S.settings,
          );
        } catch {
          ls.set('pipfolio:corrupt-copy', raw);
          toast(
            'Stored data could not be read. A raw copy was kept in browser storage.',
            'error',
          );
        }
      }
      const persist = (trades, settings) =>
        ls.set(K.data, JSON.stringify({ version: 2, trades, settings }));
      function commit(trades, settings = S.settings) {
        if (!persist(trades, settings)) {
          toast('Could not save. Browser storage is full or blocked.', 'error');
          return false;
        }
        S.trades = trades;
        S.settings = settings;
        return true;
      }
      const closed = (t) => t.exit != null && t.pl != null && !!t.xdt;
      const calc = (t) => {
        const d = t.side === 'Buy' ? 1 : -1,
          c = closed(t),
          net = c ? r2(t.pl - t.comm) : null;
        return {
          c,
          net,
          pips:
            t.exit != null
              ? Math.round(((d * (t.exit - t.entry)) / t.pipSize) * 10) / 10
              : null,
          rr:
            t.sl != null && t.tp != null && t.sl !== t.entry
              ? Math.round(
                  (Math.abs(t.tp - t.entry) / Math.abs(t.entry - t.sl)) * 100,
                ) / 100
              : null,
          R: c && t.risk > 0 ? Math.round((net / t.risk) * 100) / 100 : null,
          dur: t.xdt ? dur(t.dt, t.xdt) : null,
          res: !c ? 'Open' : net > 0 ? 'Win' : net < 0 ? 'Loss' : 'Breakeven',
        };
      };
      const calcAll = (l) => l.map((t) => ({ t, ...calc(t) }));
      const acc = (id) => S.settings.accounts.find((a) => a.id === id);
      const ccy = (t) => acc(t.account)?.currency || '';
      let CTX = '$';
      const fm = (n, plus, c = CTX) =>
        (n < 0 ? '\u2212' : plus && n > 0 ? '+' : '') +
        (c.length > 1 ? c + ' ' : c) +
        Math.abs(n).toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const cls = (n) => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');
      const short = (v) =>
        Math.abs(v) >= 1000
          ? (v / 1000).toLocaleString(undefined, { maximumFractionDigits: 1 }) +
            'k'
          : String(v);
      const nowLocal = () => {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      };
      function stats(list) {
        const all = calcAll(list),
          ts = all
            .filter((x) => x.c)
            .sort((a, b) =>
              a.t.xdt < b.t.xdt
                ? -1
                : a.t.xdt > b.t.xdt
                  ? 1
                  : a.t.created - b.t.created,
            ),
          w = ts.filter((x) => x.res === 'Win'),
          l = ts.filter((x) => x.res === 'Loss'),
          sum = (a) => r2(a.reduce((s, x) => s + x.net, 0));
        const gw = sum(w),
          gl = Math.abs(sum(l)),
          rrs = ts.filter((x) => x.rr != null);
        let st = 0,
          sr = '';
        if (ts.length) {
          sr = ts[ts.length - 1].res;
          if (sr !== 'Breakeven')
            for (let i = ts.length - 1; i >= 0 && ts[i].res === sr; i--) st++;
        }
        return {
          ts,
          w,
          l,
          n: ts.length,
          open: all.length - ts.length,
          be: ts.length - w.length - l.length,
          net: sum(ts),
          wr: ts.length ? (w.length / ts.length) * 100 : 0,
          aw: w.length ? r2(gw / w.length) : 0,
          al: l.length ? r2(-gl / l.length) : 0,
          pf: gl ? gw / gl : gw ? Infinity : null,
          rr: rrs.length
            ? rrs.reduce((s, x) => s + x.rr, 0) / rrs.length
            : null,
          best: ts.length ? ts.reduce((a, b) => (b.net > a.net ? b : a)) : null,
          worst: ts.length
            ? ts.reduce((a, b) => (b.net < a.net ? b : a))
            : null,
          st,
          sr,
        };
      }

      /* ---------- dialogs ---------- */
      const closeDlg = () => {
        dlg.onclose = null;
        if (dlg.open) dlg.close();
      };
      function openDlg(html, c = '') {
        dlg.onclose = null;
        dlg.className = c;
        dlg.innerHTML = html;
        if (!dlg.open) dlg.showModal();
      }
      function ask(title, msg, btns) {
        return new Promise((res) => {
          openDlg(
            `<div class="dh"><h2>${title}</h2></div><div class="db">
              <p class="mp">${msg}</p></div><div class="df">${btns.map((b,
                i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div>`,
            'sm',
          );
          dlg.onclose = () => res(null);
          dlg.querySelectorAll('[data-i]').forEach(
            (b) =>
              (b.onclick = () => {
                closeDlg();

              }),

        });
      }
      const confirmDel = (t, m, label) =>
        ask(t, m, [
          { label: 'Cancel', val: false },
          { label, cls: 'danger solid', val: true },
        ]);

      /* ---------- lock screen ---------- */
      function lockScreen(note) {
        const a = getAuth(),
          setup = !a;
        app.innerHTML = `<div class="lock"><div class="card">
          <div class="brand"><img src="./money.png" width="35" alt="">Pipfolio</div>${note
            ? `<p class="pos" style="margin-top:8px">${note}</p>`
              : ''}
          <form id="lf" novalidate><label class="f"><span>${setup
            ? 'New password' : 'Password'}</span><input type="password" name="pw" autocomplete="${setup
              ? 'new-password' : 'current-password'}" autofocus></label>
          ${setup ? `<label class="f"><span>Confirm password</span>
            <input type="password" name="pw2" autocomplete="new-password">
            <small class="hint">At least 8 characters. There is no recovery if you forget
            it, so keep an exported backup.</small></label>`
              : ''}
          <small class="err" id="lerr"></small><button class="btn primary block" id="lb">${setup
            ? 'Create password' : 'Unlock'}</button></form></div></div>`;
        $('#lf').onsubmit = async (e) => {
          e.preventDefault();
          const f = new FormData(e.target),
            pw = f.get('pw'),
            er = $('#lerr'),
            b = $('#lb');
          er.textContent = '';
          if (!window.crypto?.subtle) {
            er.textContent =
              'This browser blocks secure hashing. Open Pipfolio over HTTPS ' +
                '(such as GitHub Pages) or localhost.';
            return;
          }
          if (setup) {
            if (pw.length < 8) {
              er.textContent = 'Password must be at least 8 characters.';
              return;
            }
            if (pw !== f.get('pw2')) {
              er.textContent = 'Passwords do not match.';
              return;
            }
          } else if (!pw) {
            er.textContent = 'Enter your password.';
            return;
          }
          const lab = b.textContent;
          b.disabled = true;
          b.textContent = setup ? 'Creating\u2026' : 'Unlocking\u2026';
          await new Promise((r) => setTimeout(r, 30));
          try {
            if (setup) {
              if (!ls.set(K.auth, JSON.stringify(await makeAuth(pw)))) {
                er.textContent = 'Could not save. Browser storage is blocked.';
                return;
              }
            } else if (!(await checkPw(pw, a))) {
              er.textContent = 'Incorrect password.';
              return;
            }
            load();
            S.view = 'dashboard';
            render();
          } catch {
            er.textContent = 'Something went wrong. Please try again.';
          } finally {
            b.disabled = false;
            b.textContent = lab;
          }
        };
      }

      /* ---------- shell & views ---------- */
      function render() {
        const v = S.view;
        app.innerHTML = `<div class="wrap"><div class="top"><div class="brand">
          <img src="./money.png" width="35" alt="">Pipfolio</div>
          <div class="acts"><button class="btn" data-act="theme">${document.documentElement.dataset.theme === 'dark'
            ? 'Light mode' : 'Dark mode'}</button><button class="btn" data-act="lock">Lock</button>
          <button class="btn primary" data-act="add">Add trade</button></div></div>
          <nav class="tabs">${[
   ['dashboard', 'Dashboard'],
   ['trades', 'Trades'],
   ['settings', 'Settings'],
 ]
   .map(
     ([k, l]) =>
       `<button class="tab ${v === k ? 'on' : ''}" data-act="view" data-v="${k}">${l}</button>`,
   )
   .join('')}</nav>
          <main>${v === 'dashboard' ? dashboard() : v === 'trades'
            ? tradesView() : settingsView()}</main>
          <footer class="footer">\u00a9 ${new Date().getFullYear()} Pipfolio. All rights reserved.</footer></div>`;
        if (v === 'dashboard' && S.trades.length) drawCharts();
      }
      const emptyState = () =>
        `<div class="card empty"><h2>No trades yet</h2><p>Add your first trade to start tracking
          your performance.</p><button class="btn primary" data-act="add">Add trade</button></div>`;
      const scope = () =>
        S.trades.filter((t) => S.acc === 'all' || t.account === S.acc);
      const scopeAccs = () =>
        S.acc === 'all'
          ? S.settings.accounts
          : S.settings.accounts.filter((a) => a.id === S.acc);
      const accOpts = (v) =>
        `<option value="all">All accounts</option>${S.settings.accounts.map((a) => `<option value="${esc(a.id)}"
          ${v === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}`;
      function dashboard() {
        if (S.acc !== 'all' && !acc(S.acc)) S.acc = 'all';
        const as = scopeAccs(),
          cs = [...new Set(as.map((a) => a.currency))];
        CTX = cs.length === 1 ? cs[0] : '';
        const list = scope(),
          s = stats(list),
          start = r2(as.reduce((x, a) => x + a.balance, 0));
        const head = `<div class="page-h"><h1>Dashboard</h1><select id="accf" class="hsel" aria-label="Filter by account">${accOpts(S.acc)}</select></div>
          <div class="subl">${cs.length === 1 ? `Balance ${fm(r2(start
            + s.net))} \u00b7 Starting balance ${fm(start)}`
              : 'Accounts use different currencies. Totals are not converted, so ' +
                'filter by account for exact figures.'}</div>`;
        if (!S.trades.length) return head + emptyState();
        if (!s.n)
          return (
            head +
            `<div class="card empty"><h2>No closed trades yet</h2>
              <p>${s.open ? s.open + ' open trade' + (s.open > 1
                ? 's' : '') + '. Add exit details to include '
                  + (s.open > 1 ? 'them' : 'it') + ' in your statistics.'
                    : 'There are no trades for this account yet.'}</p>
              <button class="btn primary" data-act="${s.open
                ? 'view' : 'add'}" data-v="trades">${s.open ? 'View trades'
                  : 'Add trade'}</button></div>`
          );
        const c = [
          [
            'Total trades',
            s.n,
            [s.be && s.be + ' breakeven', s.open && s.open + ' open']
              .filter(Boolean)
              .join(' \u00b7 '),
          ],
          ['Winning trades', s.w.length, '', 'pos'],
          ['Losing trades', s.l.length, '', 'neg'],
          ['Win rate', s.wr.toFixed(1) + '%'],
          ['Net P&L', fm(s.net, 1), '', cls(s.net)],
          ['Average win', fm(s.aw), '', 'pos'],
          ['Average loss', fm(s.al), '', s.al ? 'neg' : ''],
          [
            'Profit factor',
            s.pf == null
              ? '\u2014'
              : s.pf === Infinity
                ? '\u221e'
                : s.pf.toFixed(2),
          ],
          [
            'Average R:R',
            s.rr == null ? '\u2014' : '1:' + s.rr.toFixed(2),
            'Planned, where SL and TP are set',
          ],
          [
            'Best trade',
            fm(s.best.net, 1),
            esc(s.best.t.pair),
            cls(s.best.net),
          ],
          [
            'Worst trade',
            fm(s.worst.net, 1),
            esc(s.worst.t.pair),
            cls(s.worst.net),
          ],
          [
            'Current streak',
            s.st
              ? s.st +
                ' ' +
                (s.sr === 'Win' ? 'win' : 'loss') +
                (s.st > 1 ? 's' : '')
              : 'None',
            '',
            s.st ? (s.sr === 'Win' ? 'pos' : 'neg') : '',
          ],
        ];
        return (
          head +
          `<div class="stats">${c.map(([l, v, sub, k]) => `<div class="card stat">
            <div class="lbl">${l}</div><div class="val ${k || ''}">${v}</div>
            <div class="sub">${sub || '&nbsp;'}</div></div>`).join('')}</div>
            <div class="charts">${[
   ['Equity curve', 'eq', 'c3'],
   ['P&L over time (by close date)', 'day', 'c3'],
   ['Win vs. loss', 'wl', 'c2'],
   ['Performance by pair', 'pair', 'c2'],
   ['Performance by session', 'sess', 'c2'],
 ]
   .map(
     ([t, id, k]) =>
       `<div class="card ${k}"><h2>${t}</h2><div class="chart" data-chart="${id}"></div></div>`,
   )
   .join('')}</div>`
        );
      }

      const CH = 240,
        M = { l: 52, r: 14, t: 14, b: 30 };
      const niceStep = (x) => {
        const p = 10 ** Math.floor(Math.log10(x)),
          f = x / p;
        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
      };
      function axis(min, max) {
        if (min === max) {
          min -= 1;
          max += 1;
        }
        const st = niceStep((max - min) / 4),
          lo = Math.floor(min / st) * st,
          hi = Math.ceil(max / st) * st,
          ticks = [];
        for (let v = lo; v <= hi + st / 2; v += st)
          ticks.push(Math.round(v * 1e6) / 1e6);
        return { lo, hi: ticks[ticks.length - 1], ticks };
      }
      function frame(w, ax) {
        const ih = CH - M.t - M.b,
          y = (v) => M.t + ih * (1 - (v - ax.lo) / (ax.hi - ax.lo));
        return {
          y,
          g: ax.ticks
            .map(
              (v) =>
                `<line class="grid" x1="${M.l}" x2="${w - M.r}" y1="${y(v)}" y2="${y(v)}"/>
                  <text class="tick" x="${M.l - 8}" y="${y(v)
                    + 4}" text-anchor="end">${short(v)}</text>`,
            )
            .join(''),
        };
      }
      function xl(w, labels, xf) {
        const step = Math.ceil(
          labels.length / Math.max(1, Math.floor((w - M.l - M.r) / 64)),
        );
        return labels
          .map((l, i) =>
            i % step
              ? ''
              : `<text class="tick" x="${xf(i)}" y="${CH - 8}" text-anchor="middle">${esc(l.length > 9
                ? l.slice(0, 8) + '\u2026' : l)}</text>`,
          )
          .join('');
      }
      const noData = (m) => `<div class="chart-empty">${m}</div>`;
      function barChart(w, items) {
        if (!items.length) return noData('No data yet');
        const vs = items.map((i) => i.v),
          ax = axis(Math.min(0, ...vs), Math.max(0, ...vs)),
          { y, g } = frame(w, ax),
          n = items.length,
          iw = (w - M.l - M.r) / n,
          bw = Math.min(40, iw * 0.6),
          xc = (i) => M.l + iw * (i + 0.5);
        return `<svg viewBox="0 0 ${w} ${CH}" width="${w}" height="${CH}">${g}<line class="zero" x1="${M.l}"
          x2="${w - M.r}" y1="${y(0)}" y2="${y(0)}"/>${items
          .map((it, i) => {
            const a = y(0),
              b = y(it.v);
            return `<rect class="${it.v >= 0 ? 'pos' : 'neg'}" x="${xc(i) - bw / 2}" y="${Math.min(a,
              b)}" width="${bw}" height="${Math.max(1, Math.abs(b - a))}" rx="3">
              <title>${esc(it.l)}: ${fm(it.v, 1)}</title></rect>`;
          })
          .join('')}${xl(
          w,
          items.map((i) => i.l),
          xc,
        )}</svg>`;
      }
      function lineChart(w, pts) {
        if (pts.length < 2) return noData('Add trades to see this chart');
        const vs = pts.map((p) => p.v),
          ax = axis(Math.min(...vs), Math.max(...vs)),
          { y, g } = frame(w, ax),
          n = pts.length,
          x = (i) => M.l + ((w - M.l - M.r) * i) / (n - 1),
          d = pts
            .map(
              (p, i) =>
                `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`,
            )
            .join('');
        return `<svg viewBox="0 0 ${w} ${CH}" width="${w}" height="${CH}">
          <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--ac);stop-opacity:.22"/>
          <stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>${g}<path
          d="${d}L${x(n - 1)} ${y(ax.lo)}L${x(0)} ${y(ax.lo)}Z" fill="url(#eg)"/>
          <path class="ln" d="${d}"/>${n <= 40 ? pts.map((p, i) => `<circle class="dot" cx="${x(i)}"
            cy="${y(p.v)}" r="3"><title>${esc(p.l)}: ${fm(p.v)}</title></circle>`).join('')
              : ''}${xl(
          w,
          pts.map((p) => p.l),
          x,
        )}</svg>`;
      }
      function donut(w, s) {
        const parts = [
            ['Wins', s.w.length, 'var(--pos)'],
            ['Losses', s.l.length, 'var(--neg)'],
            ['Breakeven', s.be, 'var(--mut)'],
          ],
          r = 62,
          C = 2 * Math.PI * r,
          cx = w / 2;
        let off = 0;
        const seg = parts
          .filter((p) => p[1])
          .map((p) => {
            const len = (p[1] / s.n) * C,
              e = `<circle cx="${cx}" cy="100" r="${r}" fill="none" stroke="${p[2]}" stroke-width="22"
                stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} 100)">
                <title>${p[0]}: ${p[1]}</title></circle>`;
            off += len;
            return e;
          })
          .join('');
        return `<svg viewBox="0 0 ${w} ${CH}" width="${w}" height="${CH}">${seg}<text x="${cx}" y="106"
          text-anchor="middle" style="fill:var(--tx);font-size:18px;font-weight:650">${s.wr.toFixed(0)}%</text>${parts
          .map((p, i) => {
            const x = (w * (2 * i + 1)) / 6;
            return `<circle cx="${x - 24}" cy="${CH - 14}" r="4" fill="${p[2]}"/>
              <text class="tick" x="${x - 16}" y="${CH - 10}">${p[0]} ${p[1]}</text>`;
          })
          .join('')}</svg>`;
      }
      function group(ts, key) {
        const m = new Map();
        ts.forEach((x) => m.set(key(x), r2((m.get(key(x)) || 0) + x.net)));
        return [...m].map(([l, v]) => ({ l, v }));
      }
      function drawCharts() {
        const s = stats(scope());
        if (!s.n) return;
        let run = r2(scopeAccs().reduce((x, a) => x + a.balance, 0));
        const eq = [
          { l: 'Start', v: run },
          ...s.ts.map((x) => ({
            l: x.t.xdt.slice(5, 10),
            v: (run = r2(run + x.net)),
          })),
        ];
        const day = group(s.ts, (x) => x.t.xdt.slice(0, 10))
          .slice(-20)
          .map((i) => ({ l: i.l.slice(5), v: i.v }));
        const pair = group(s.ts, (x) => x.t.pair)
            .sort((a, b) => b.v - a.v)
            .slice(0, 8),
          sess = group(s.ts, (x) => x.t.session).sort(
            (a, b) => SESS.indexOf(a.l) - SESS.indexOf(b.l),
          );
        const f = {
          eq: (w) => lineChart(w, eq),
          day: (w) => barChart(w, day),
          wl: (w) => donut(w, s),
          pair: (w) => barChart(w, pair),
          sess: (w) => barChart(w, sess),
        };
        document.querySelectorAll('[data-chart]').forEach((el) => {
          const w = Math.max(240, Math.floor(el.clientWidth));
          el.innerHTML = f[el.dataset.chart](w);
        });
      }
      let rt;
      addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (S.view === 'dashboard' && $('[data-chart]')) drawCharts();
        }, 150);
      });

      const tfilter = () => {
        const q = S.q.trim().toLowerCase();
        return calcAll(S.trades)
          .sort((a, b) =>
            a.t.dt < b.t.dt
              ? 1
              : a.t.dt > b.t.dt
                ? -1
                : b.t.created - a.t.created,
          )
          .filter(
            (x) =>
              (S.res === 'all' || x.res === S.res) &&
              (S.tacc === 'all' || x.t.account === S.tacc) &&
              (!q ||
                (x.t.pair + ' ' + x.t.setup + ' ' + x.t.notes)
                  .toLowerCase()
                  .includes(q)),
          );
      };
      function tradesView() {
        const head = `<div class="page-h"><h1>Trades</h1></div>`;
        if (!S.trades.length) return head + emptyState();
        return (
          head +
          `<div class="filters"><input id="q" type="search" placeholder="Search pair, setup or notes"
            value="${esc(S.q)}" aria-label="Search trades"><select id="tacc" aria-label="Filter by account">${accOpts(S.tacc)}</select>
            <select id="res" aria-label="Filter by result">${['all',
              'Open', 'Win', 'Loss', 'Breakeven'].map((r) => `<option value="${r}" ${S.res === r

      function validate(f, id) {
        const e = {},

            e[n] = 'Enter a valid number';
            return null;
          }
          return x;
        };
        const opt = (n) => {
          const v = g(n);
          if (v === '') return null;
          const x = Number(v);
          if (!Number.isFinite(x)) {
            e[n] = 'Enter a valid number';
            return null;
          }
          return x;
        };
        const ed = g('ed'),
          et = g('et'),
          xd = g('xd'),
          xt = g('xt'),
          pair = g('pair').toUpperCase(),
          side = g('side'),
          session = g('session'),
          dt = ed && et ? ed + 'T' + et : '';
        let xdt = '';
        if (!acc(g('account'))) e.account = 'Select an account';
        if (!ed) e.ed = 'Required';
        if (!et) e.et = 'Required';
        if (dt && dt > now) e.ed = 'Entry cannot be in the future';
        if (xd || xt) {

          if (!xt) e.xt = 'Add the exit time';
          if (xd && xt) {

            if (xdt > now) e.xd = 'Exit cannot be in the future';
            else if (dt && xdt < dt) e.xd = 'Exit cannot be before entry';
          }

        if (!pair) e.pair = 'Required';

        const entry = req('entry'),
          lots = req('lots'),

          pl = opt('pl'),
          sl = opt('sl'),
          tp = opt('tp'),
          risk = opt('risk'),
          comm = opt('comm'),

          ['exit', exit],
          ['lots', lots],
          ['sl', sl],
          ['tp', tp],

            xdt,

            entry,
            sl,

        return { errs: trade ? {} : { pair: 'Trade data is invalid' }, trade };

      async function importFile(file) {
        if (!file) return;
        const fail = (m) => toast(m, 'error');
        if (file.size > 10 * 1024 * 1024)
          return fail('Import failed: file is larger than 10 MB.');
        let d;
        try {
          const txt = await file.text();
          if (!txt.trim()) return fail('Import failed: the file is empty.');
          d = JSON.parse(txt);
        } catch {
          return fail('Import failed: the file is not valid JSON.');
        }
        if (!d || d.app !== 'Pipfolio' || !Array.isArray(d.trades))
          return fail('Import failed: this is not a Pipfolio backup file.');
        const ok = d.trades.map(clean).filter(Boolean),
          skipped = d.trades.length - ok.length,
          dup = new Map();
        ok.forEach((t) => {
          const o = dup.get(t.id);
          if (!o || t.updated >= o.updated) dup.set(t.id, t);
        });
        if (d.trades.length && !dup.size)
          return fail(
            'Import failed: no valid trades were found in this file.',
          );
        const st = cleanSettings(d.settings),
          trades = norm([...dup.values()], st);
        const note = `${trades.length} trade${trades.length === 1
          ? '' : 's'} and ${st.accounts.length} account${st.accounts.length === 1
            ? '' : 's'} found${skipped ? `, ${skipped} invalid trade${skipped > 1
              ? 's' : ''} skipped` : ''}.`;
        if (S.importMode === 'setup') {
          if (!goodAuth(d.auth))
            return fail(
              'Import failed: this backup does not contain a password.',
            );
          if (!persist(trades, st) || !ls.set(K.auth, JSON.stringify(d.auth)))
            return fail('Could not save. Browser storage is full or blocked.');
          if (d.theme === 'dark' || d.theme === 'light') setTheme(d.theme);
          return lockScreen(
            'Backup restored. Enter your backup password to open the journal.',
          );
        }
        const ch = await ask(
          'Import backup',
          `${note}<br><br><b>Merge</b> adds new accounts and trades and keeps your current
            data. <b>Replace</b> overwrites all accounts, trades and settings with the backup.`,
          [
            { label: 'Cancel', val: null },
            { label: 'Merge', val: 'm' },
            { label: 'Replace', cls: 'primary', val: 'r' },
          ],
        );
        if (!ch) return;
        if (ch === 'm') {
          const am = new Map(S.settings.accounts.map((a) => [a.id, a]));
          st.accounts.forEach((a) => am.has(a.id) || am.set(a.id, a));
          const ns = { accounts: [...am.values()] },
            m = new Map(S.trades.map((t) => [t.id, t]));
          let add = 0,
            upd = 0;
          trades.forEach((t) => {
            const o = m.get(t.id);
            if (!o) {
              m.set(t.id, t);
              add++;
            } else if (t.updated > o.updated) {
              m.set(t.id, t);
              upd++;
            }
          });
          if (commit(norm([...m.values()], ns), ns)) {
            toast(`Merged: ${add} added, ${upd} updated`);
            render();
          }
          return;
        }
        if (
          !(await confirmDel(
            'Replace all data?',
            'This overwrites every account, trade and setting in this ' +
              'browser. Export a backup first if you might need the current ' +
              'data.',
            'Replace data',
          ))
        )
          return;
        const prev = ls.get(K.auth);
        if (!commit(trades, st)) return;
        if (goodAuth(d.auth) && !ls.set(K.auth, JSON.stringify(d.auth))) {
          if (prev) ls.set(K.auth, prev);
        }
        if (d.theme === 'dark' || d.theme === 'light') setTheme(d.theme);
        S.acc = S.tacc = 'all';
        toast(
          'Backup restored' +
            (goodAuth(d.auth)
              ? '. Your password is now the one from the backup.'
              : ''),
        );
        render();
      }

      /* ---------- actions ---------- */
      const act = {
        view: (d) => {
          S.view = d.v;
          render();
        },
        theme: () => {
          setTheme(
            document.documentElement.dataset.theme === 'dark'
              ? 'light'
              : 'dark',
          );
          render();
        },
        lock: () => {
          S.trades = [];
          closeDlg();
          lockScreen();
        },
        add: () => tradeForm(),
        close: closeDlg,
        detail: (d) => detail(d.id),
        edit: (d) => tradeForm(S.trades.find((t) => t.id === d.id)),
        del: async (d) => {
          const t = S.trades.find((x) => x.id === d.id);
          if (!t) return;
          if (
            (await confirmDel(
              'Delete this trade?',
              `${esc(t.pair)} ${t.side} on ${t.dt.replace('T',
                ' ')} will be permanently deleted.`,
              'Delete trade',
            )) &&
            commit(S.trades.filter((x) => x.id !== d.id))
          ) {
            toast('Trade deleted');
            render();
          }
        },
        accadd: () => accForm(),
        accedit: (d) => accForm(acc(d.id)),
        accview: (d) => {
          S.acc = d.id;
          S.view = 'dashboard';
          render();
        },
        accdel: async (d) => {
          const a = acc(d.id);
          if (!a) return;
          if (S.settings.accounts.length < 2)
            return toast(
              'Keep at least one account. Add another before deleting this one.',
              'error',
            );
          const n = S.trades.filter((t) => t.account === d.id).length;
          if (
            await confirmDel(
              'Delete this account?',
              `${esc(a.name)} will be deleted${n ? ` along with its ${n} trade${n > 1
                ? 's' : ''}` : ''}. This cannot be undone. Export a backup first if you might
                need it.`,
              'Delete account',
            )
          ) {
            const st = {
              accounts: S.settings.accounts.filter((x) => x.id !== d.id),
            };
            if (
              commit(
                S.trades.filter((t) => t.account !== d.id),
                st,
              )
            ) {
              if (S.acc === d.id) S.acc = 'all';
              if (S.tacc === d.id) S.tacc = 'all';
              toast('Account deleted');
              render();
            }
          }
        },
        exit: (d) =>
          tradeForm(
            S.trades.find((t) => t.id === d.id),
            'xd',
          ),
        export: exportData,
        import: () => {
          S.importMode = 'main';
          $('#file').click();
        },
        restore: () => {
          S.importMode = 'setup';
          $('#file').click();
        },
        forgot: async () => {
          if (
            await confirmDel(
              'Erase journal?',
              "Passwords cannot be recovered. You can erase this browser's " +
                "journal and start over, or restore from a backup file " +
                "afterwards. All data here will be deleted.",
              'Erase all data',
            )
          ) {
            [K.data, K.auth].forEach(ls.del);
            lockScreen('Journal erased. Create a new password.');
          }
        },
        erase: async () => {
          if (
            await confirmDel(
              'Erase all data?',
              'All trades, settings and your password will be permanently ' +
                'deleted from this browser.',
              'Erase all data',
            )
          ) {
            [K.data, K.auth].forEach(ls.del);
            S.trades = [];
            S.settings = cleanSettings();
            S.acc = S.tacc = 'all';
            closeDlg();
            lockScreen('Journal erased. Create a new password.');
          }
        },
        chpw: () => {
          openDlg(
            `<div class="dh"><h2>Change password</h2></div><form id="cf" novalidate style="display:contents">
              <div class="db"><div class="grid2"><div class="full">${F('cur',
                'Current password', '<input type="password" name="cur" ' +
                  'autocomplete="current-password">')}</div>${F('n1',
                    'New password', '<input type="password" name="n1" autocomplete="new-password">')}${F('n2',
                      'Confirm new password', '<input type="password" name="n2" autocomplete="new-password">')}</div></div>
              <div class="df"><button type="button" class="btn" data-act="close">Cancel</button>
              <button class="btn primary" id="cb">Change password</button></div></form>`,
          );
          $('#cf').onsubmit = async (ev) => {
            ev.preventDefault();
            const f = new FormData(ev.target),
              e = {};
            if (!window.crypto?.subtle)
              e.cur = 'Secure hashing is unavailable in this context';
            else {
              const a = getAuth();
              if (!f.get('cur') || !a || !(await checkPw(f.get('cur'), a)))
                e.cur = 'Incorrect password';
              if (String(f.get('n1')).length < 8)
                e.n1 = 'At least 8 characters';
              else if (f.get('n1') !== f.get('n2'))
                e.n2 = 'Passwords do not match';
            }
            dlg.querySelectorAll('[data-f]').forEach((l) => {
              l.classList.toggle('bad', !!e[l.dataset.f]);
              $('.err', l).textContent = e[l.dataset.f] || '';
            });
            if (Object.keys(e).length) return;
            const b = $('#cb');
            b.disabled = true;
            b.textContent = 'Saving\u2026';
            if (ls.set(K.auth, JSON.stringify(await makeAuth(f.get('n1'))))) {
              closeDlg();
              toast('Password changed');
            } else {
              b.disabled = false;
              b.textContent = 'Change password';
              toast('Could not save. Browser storage is blocked.', 'error');
            }
          };
        },
      };
      document.addEventListener('click', (e) => {
        const a = e.target.closest('[data-act]');
        if (a && act[a.dataset.act]) act[a.dataset.act](a.dataset);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.matches('tr[data-act]'))
          act.detail(e.target.dataset);
      });
      document.addEventListener('input', (e) => {
        const i = e.target.id;
        if (i === 'q' || i === 'res' || i === 'tacc') {
          S.q = $('#q').value;
          S.res = $('#res').value;
          S.tacc = $('#tacc').value;
          $('#tl').innerHTML = tradeTable(tfilter(), S.trades.length);
        }
        if (i === 'accf') {
          S.acc = e.target.value;
          render();
        }
      });
      $('#file').onchange = async (e) => {
        const f = e.target.files[0];
        e.target.value = '';
        await importFile(f);
      };

      /* ---------- start ---------- */
      if (!ls.set('pipfolio:probe', '1'))
        app.innerHTML =
          `<div class="lock"><div class="card"><div class="brand">Pipfolio</div>
            <p class="neg" style="margin-top:16px">Browser storage is blocked. Enable cookies
            / site data for this page (and leave private mode) so the journal can be saved.</p></div></div>`;
      else {
        ls.del('pipfolio:probe');
        lockScreen();
      }
    </script>
  </body>
</html>
