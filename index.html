/* Unified card geometry and type scale. One source of truth for all dashboard rows. */
:root{--card-border-width:3px;--card-radius:14px;--card-gap:16px;--card-padding:18px;--text-caption:12px;--text-body:14px;--text-label:13px;--text-heading:16px;--text-metric:24px}
.card,.refdash .ref-card,.acc{box-sizing:border-box;border:var(--card-border-width) solid var(--bd);border-radius:var(--card-radius);background:var(--card)}
.refdash{--dash-gap:var(--card-gap);--dash-pad:var(--card-padding);gap:var(--card-gap)}
.refdash .ref-top,.refdash .ref-mid,.refdash .ref-bottom,.refdash .ref-legacy,.refdash .ref-morecharts{gap:var(--card-gap);align-items:stretch;min-width:0}
.refdash .ref-card{box-sizing:border-box;min-width:0;width:100%;margin:0;padding:var(--card-padding);border:var(--card-border-width) solid var(--bd);border-radius:var(--card-radius)}
.refdash .ref-mid{grid-template-columns:repeat(3,minmax(0,1fr))}
.refdash .ref-mid>.ref-card{height:clamp(430px,38vw,560px);min-height:0}
.refdash .ref-mid>.ref-combined{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:var(--card-gap)}
.refdash .ref-combined-section{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.refdash .ref-combined-section+.ref-combined-section{border-top:2px solid var(--bd);padding-top:var(--card-gap)}
.refdash .ref-combined-section .ref-title{flex:0 0 auto}
.refdash .ref-combined-section .ref-plot{flex:1 1 0;height:0;min-height:0;margin-top:8px}
.refdash .ref-mid .ref-plot{min-width:0;overflow:hidden;margin-top:10px}
.refdash .ref-bottom{align-items:stretch}
.refdash .ref-activity-card{min-height:0}
/* Typography by role: all matching text elements share exactly the same sizes. */
.refdash .ref-title{font-size:var(--text-label);line-height:1.4;letter-spacing:.3px;gap:8px;overflow-wrap:anywhere}
.refdash .ref-value{font-size:clamp(19px,1.7vw,var(--text-metric));line-height:1.3}
.refdash .ref-sub,.lbl,.count,.cal-sum,.cal-hint{font-size:var(--text-caption);line-height:1.5}
.refdash .ref-activity-row{font-size:var(--text-body);line-height:1.45;padding:7px 2px}
.refdash .ref-chip,.refdash .ref-activity-date{font-size:var(--text-caption);line-height:1.4}
.refdash .ref-chip{padding:3px 8px}
.refdash .ref-legacy .ref-value{font-size:20px}
h2,.page-h h2{font-size:var(--text-heading)}
.f>span,th,.cal-num,.cal-v{font-size:var(--text-label)}
.refdash .ref-top,.refdash .ref-mid,.refdash .ref-bottom,.refdash .ref-legacy,.refdash .ref-morecharts{row-gap:var(--card-gap);column-gap:var(--card-gap)}
@media(max-width:620px){.refdash .ref-mid>.ref-card{height:430px}.refdash .ref-title{font-size:var(--text-label)}.refdash .ref-info{flex-shrink:0}}

.brand-mark{display:inline-grid;place-items:center;flex:none;width:35px;height:35px;border-radius:9px;background:#3565df;color:#fff;font-size:26px;font-weight:750;line-height:1}

    best: ts.length ? ts.reduce((a, b) => (b.net > a.net ? b : a)) : null,
    worst: ts.length
        ? ts.reduce((a, b) => (b.net < a.net ? b : a))
        : null,
    st,
    sr,
    };
}

function authScreen(mode = 'signin', message = '') {
    closeDlg();
    const signup = mode === 'signup', reset = mode === 'reset', update = mode === 'update';
    const failedLoad = mode === 'loaderror';
    const title = signup ? 'Create your account' : reset ? 'Reset your password'
        : update ? 'Set a new password' : failedLoad ? 'Journal unavailable' : 'Welcome to Pipfolio';
    app.innerHTML = `<div class="lock"><div class="card">
        <div class="brand">Pipfolio</div><h2 style="margin-top:16px">${title}</h2>
        <p class="auth-note">${failedLoad ? 'Retry loading before making any changes.' : update
            ? 'Choose a password with at least 8 characters.' : 'Your trading journal, saved to your account.'}</p>
        <p id="auth-message" class="auth-status" role="status">${esc(message)}</p>
        ${failedLoad ? `<div class="auth-links"><button type="button" class="btn primary" id="auth-retry">Retry loading</button><button type="button" class="btn" id="auth-signout">Sign out</button></div>`
        : `<form id="auth-form">
            ${!update ? '<label class="f"><span>Email address</span><input type="email" name="email" autocomplete="email" required maxlength="254"></label>' : ''}
            ${!reset ? `<label class="f"><span>Password</span><input type="password" name="password" autocomplete="${signup||update?'new-password':'current-password'}" required ${signup||update?'minlength="8"':''}></label>` : ''}
            ${signup||update ? '<label class="f"><span>Confirm password</span><input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>' : ''}
            <button class="btn primary block" id="auth-submit">${signup?'Create account':reset?'Send reset email':update?'Save password':'Sign in'}</button>
        </form>
        <div class="auth-links">${update ? '<button type="button" class="btn" id="auth-back">Back to journal</button><button type="button" class="btn" id="auth-signout">Sign out</button>' : `<button type="button" class="btn" id="auth-toggle">${signup||reset?'Back to sign in':'Create account'}</button>${!reset?'<button type="button" class="btn" id="auth-forgot">Forgot password?</button>':''}`}</div>`}
        </div></div>`;
    const say = (text, error = false) => {
        const el = $('#auth-message');
        if(el) {el.textContent = text;el.classList.toggle('neg', error);}
    };
    $('#auth-retry')?.addEventListener('click',()=>currentUser && loadAccount(currentUser,true));
    $('#auth-toggle')?.addEventListener('click',()=>authScreen(signup||reset?'signin':'signup'));
    $('#auth-forgot')?.addEventListener('click',()=>authScreen('reset'));
    $('#auth-signout')?.addEventListener('click',signOut);
    $('#auth-back')?.addEventListener('click',async()=>{
        if(recoveryMode) return say('Save your new password first, or sign out.');
        if(currentUser) await loadAccount(currentUser,true);
    });
    $('#auth-form')?.addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.target, fields = new FormData(form);
        const email = String(fields.get('email')||'').trim();
        const password = String(fields.get('password')||'');
        if((signup||update) && password !== fields.get('confirm')) return say('Passwords do not match.',true);
        const button = $('#auth-submit'); button.disabled = true;
        // Prevent navigation during an authentication request.
        app.querySelectorAll('.auth-links button').forEach(b=>b.disabled=true);
        say('Please wait…');
        try {
            if(update) {
                const {error} = await db.auth.updateUser({password});
                if(error) throw error;
                recoveryMode = false;
                const {data,error:sessionError} = await db.auth.getSession();
                if(sessionError) throw sessionError;
                if(!data.session) throw new Error('Please sign in again with your new password.');
                await loadAccount(data.session.user,true);
                toast('Password updated');
            } else if(reset) {
                const {error} = await db.auth.resetPasswordForEmail(email,{redirectTo:redirectURL()});
                if(error) throw error;
                say('If an account exists for that email, a password reset link has been sent.');
            } else {
                const result = signup
                    ? await db.auth.signUp({email,password,options:{emailRedirectTo:redirectURL()}})
                    : await db.auth.signInWithPassword({email,password});
                if(result.error) throw result.error;
                if(result.data.session) await loadAccount(result.data.session.user);
                else say('Check your email for a confirmation link, then return here to sign in. If you already have an account, sign in or reset your password.');
            }
        } catch(error) {say(error.message || 'Could not complete the request. Try again.', true);}
        finally {
            button.disabled = false;
            form.querySelector('[name="password"]') && (form.querySelector('[name="password"]').value='');
            form.querySelector('[name="confirm"]') && (form.querySelector('[name="confirm"]').value='');
            app.querySelectorAll('.auth-links button').forEach(b=>b.disabled=false);
        }
    });
}

    if(saving) return;

async function startCloud() {
    if(SUPABASE_URL.includes('YOUR_PROJECT') || SUPABASE_PUBLISHABLE_KEY.includes('YOUR_SUPABASE')) {
        app.innerHTML = '<div class="lock"><div class="card"><div class="brand">Pipfolio</div><h2 style="margin-top:16px">Connect your Supabase project</h2><p class="auth-note">Open index.html in a text editor. Fill in SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY near the start of the JavaScript, then upload it again. Run supabase-setup.sql in your Supabase project first.</p></div></div>';
        return;
    }
    if(!window.supabase?.createClient) {
        app.innerHTML = '<div class="lock"><div class="card">The Supabase library could not load. Check your connection or content blocker, then refresh.</div></div>';
        return;
    }
    try {
        db = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
            auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}
        });
        db.auth.onAuthStateChange((event,session)=>{
            // Do not await another Supabase call inside this callback.
            if(event === 'PASSWORD_RECOVERY') {
                recoveryMode = true;
                setTimeout(()=>{if(recoveryMode) {clearAccount();currentUser=session?.user||null;authScreen('update');}},0);
            } else if(event === 'SIGNED_OUT') {
                recoveryMode = false;clearAccount();authScreen();
            } else if(event === 'SIGNED_IN' && session) {
                const eventGeneration = authGeneration;
                setTimeout(()=>{
                    if(!recoveryMode && eventGeneration === authGeneration) loadAccount(session.user);
                },0);
            }
        });
        const {data,error} = await db.auth.getSession();
        if(error) throw error;
        const authError = new URLSearchParams(location.hash.slice(1)).get('error_description')
            || new URLSearchParams(location.search).get('error_description');
        if(authError) {
            history.replaceState(null,'',location.pathname);
            authScreen('signin', authError);
        } else if(recoveryMode && data.session) {
            currentUser=data.session.user;authScreen('update');
        } else if(data.session) await loadAccount(data.session.user);
        else authScreen();
    } catch(error) {authScreen('signin','Connection error: '+error.message);}
}

function dashboard() {
    if (S.acc !== 'all' && !acc(S.acc)) S.acc = 'all';
    const accounts = scopeAccs();
    const currencies = [...new Set(accounts.map(a => a.currency))];
    CTX = currencies.length === 1 ? currencies[0] : '';
    const mixed = currencies.length > 1;
    const s = stats(scope());
    const balance = accounts.reduce((sum,a) => sum + a.balance + flowNet(a), 0) + s.net;
    const head = `<div class="page-h"><div><h1 class="dashboard-heading-quote"><span class="dashboard-quote-mark" aria-hidden="true">“</span><span class="dashboard-quote-text">${esc(dashboardQuote())}</span><span class="dashboard-quote-mark" aria-hidden="true">”</span></h1></div><div class="dashboard-top-actions"><div class="dashboard-balance"><strong class="${cls(balance)}">${mixed?'—':fm(balance,1)}</strong></div><select id="accf" class="hsel" aria-label="Filter by account">${accOpts(S.acc)}</select></div></div>`;
    if (!S.trades.length) return head + emptyState();
    if (!s.n) return head + `<div class="card empty"><h2>Nothing to Chart Yet</h2><p>${s.open ? `${s.open} open trade(s). Close a trade to see your results.` : 'No closed trades in this account yet.'}</p><button class="btn primary" data-act="view" data-v="trades">See trades</button></div>`;
    const money = n => mixed ? '—' : fm(n,1);
    const pct = n => `${n.toFixed(1)}%`;
    const profit = s.ts.filter(x => x.net > 0).reduce((a,x)=>a+x.net,0);
    const loss = -s.ts.filter(x => x.net < 0).reduce((a,x)=>a+x.net,0);
    const expectancy = s.net/s.n;
    let peak = 0, running = 0, drawdown = 0;
    const equity = [0];
    for (const x of s.ts) { running += x.net; equity.push(running); peak=Math.max(peak,running); drawdown=Math.max(drawdown,peak-running); }
    const dayTotals = new Map();
    for (const x of s.ts) { const day=x.t.xdt.slice(0,10); dayTotals.set(day,(dayTotals.get(day)||0)+x.net); }
    const winningDays=[...dayTotals.values()].filter(v=>v>0).length;
    const dayWinRate=dayTotals.size?100*winningDays/dayTotals.size:0;
    const avgWin=s.w.length?profit/s.w.length:0;
    const avgLoss=s.l.length?loss/s.l.length:0;
    const avgRatio=avgLoss?avgWin/avgLoss:null;
    const gauge=(rate,caption)=>`<div class="kpi-gauge"><svg viewBox="0 0 120 78" aria-hidden="true"><path d="M 12 65 A 48 48 0 0 1 108 65" pathLength="100" fill="none" stroke="var(--bd)" stroke-width="9" stroke-linecap="round"/><path d="M 12 65 A 48 48 0 0 1 108 65" pathLength="100" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.max(0,Math.min(100,rate))} 100"/></svg><strong>${rate.toFixed(1)}%</strong></div><span class="kpi-gauge-side">${caption}</span>`;
    const metricCards=[
      {label:'Net P&L',value:money(s.net),color:cls(s.net),sub:`${s.n} closed trades · ${money(s.ts.reduce((sum,x)=>sum+(Number(x.t.commission)||0),0))} commissions`,help:'Total profit or loss from closed trades after recorded costs.'},
      {label:'Trade Win %',content:gauge(s.wr,`${s.w.length} W<br>${s.be} BE<br>${s.l.length} L`),help:'Winning closed trades divided by all closed trades, including breakeven trades.'},
      {label:'Profit Factor',value:s.pf===null?'—':s.pf===Infinity?'∞':s.pf.toFixed(2),sub:'Gross profit ÷ gross loss',help:'Gross profits from winning trades divided by absolute gross losses.'},
      {label:'Day Win %',content:gauge(dayWinRate,`${dayTotals.size} days`),help:'Percentage of close dates with a positive total net P&L.'},
      {label:'Avg Win / Loss',value:avgRatio===null?'—':avgRatio.toFixed(2),content:`<div class="kpi-ratio"><div class="kpi-ratio-track"><span style="width:${avgWin+avgLoss?100*avgWin/(avgWin+avgLoss):50}%"></span></div><div class="kpi-ratio-labels"><span class="pos">+${money(avgWin)} avg win</span><span class="neg">-${money(avgLoss)} avg loss</span></div></div>`,help:'Average winning trade divided by absolute average losing trade.'}
    ];
    const width=800,height=230,pad=42;
    const lo=Math.min(0,...equity),hi=Math.max(0,...equity),range=hi-lo||1;
    const px=i=>pad+i*(width-2*pad)/Math.max(1,equity.length-1);
    const py=v=>height-pad-(v-lo)/range*(height-2*pad);
    const points=equity.map((v,i)=>`${px(i)},${py(v)}`).join(' ');
    const baseline=py(0);
    const grid='';
    const curve=`<svg class="progress-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Interactive cumulative trading profit and loss chart" preserveAspectRatio="none"><defs><linearGradient id="progress-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--ac)" stop-opacity=".24"/><stop offset="1" stop-color="var(--ac)" stop-opacity=".015"/></linearGradient></defs>${grid}<line x1="${pad}" x2="${width-pad}" y1="${baseline}" y2="${baseline}" stroke="var(--mut)" stroke-dasharray="5 5"/><polygon points="${pad},${height-pad} ${points} ${width-pad},${height-pad}" fill="url(#progress-fill)"/><polyline points="${points}" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><line class="progress-guide" x1="${pad}" x2="${pad}" y1="${pad}" y2="${height-pad}" stroke="var(--ac)" stroke-dasharray="4 4" opacity="0"/><ellipse class="progress-dot" cx="${pad}" cy="${py(equity[0])}" rx="6" ry="6" fill="var(--ac)" stroke="var(--card)" stroke-width="3" vector-effect="non-scaling-stroke" opacity="0"/><rect class="progress-hit" x="${pad}" y="${pad}" width="${width-2*pad}" height="${height-2*pad}" fill="transparent" tabindex="0" role="img" aria-label="Move across chart to inspect each cumulative profit and loss value"/></svg>`;
    const progressValues=equity.map(v=>Number(v.toFixed(2)));
    const progressDates=[null,...s.ts.map(x=>x.t.xdt.slice(0,10))];
    // Compact, data-driven charts: no fixed-height empty panels.
    const outcomes = [{name:'Wins',count:s.w.length,color:'var(--pos)'},{name:'Losses',count:s.l.length,color:'var(--neg)'},{name:'Breakeven',count:s.be,color:'var(--mut)'}];
    let offset = 0;
    const outcomeHelp = {Wins:'Closed trades with positive net profit after trading costs.',Losses:'Closed trades with negative net profit after trading costs.',Breakeven:'Closed trades with zero net profit after trading costs.'};
    const rings = outcomes.filter(x=>x.count).map(x=>{const dash=100*x.count/s.n;const part=`<circle class="outcome-slice chart-pop-target" data-chart-title="${x.name}: ${x.count} Trades (${dash.toFixed(1)}%)" data-chart-detail="${outcomeHelp[x.name]}" cx="50" cy="50" r="34" fill="none" stroke="${x.color}" stroke-width="15" pathLength="100" stroke-dasharray="${dash} ${100-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 50 50)" tabindex="0" role="img" aria-label="${x.name}: ${x.count} trades, ${dash.toFixed(1)} percent"></circle>`;offset+=dash;return part;}).join('');
    const outcomeChart = `<div class="simple-donut outcome-only"><svg viewBox="0 0 100 100" role="group" aria-label="Trade outcomes. Hover or focus a segment for its result"><circle cx="50" cy="50" r="34" fill="none" stroke="var(--bd)" stroke-width="15"/>${rings}<text x="50" y="48" text-anchor="middle" fill="var(--tx)" font-size="16" font-weight="800" pointer-events="none">${pct(s.wr)}</text><text x="50" y="60" text-anchor="middle" fill="var(--mut)" font-size="7" pointer-events="none">Win Rate</text></svg></div>`;
    const months=new Map();
    for(const x of s.ts){const key=x.t.xdt.slice(0,7);months.set(key,(months.get(key)||0)+x.net);}

const CH = 240,

const niceStep = (x) => {
    const p = 10 ** Math.floor(Math.log10(x)),

};
function axis(min, max) {

    hi = Math.ceil(max / st) * st,
    ticks = [];

    return { lo, hi: ticks[ticks.length - 1], ticks };

function frame(w, ax) {

    y,
    g: ax.ticks

        (v) =>
            `<line class="grid" x1="${M.l}" x2="${w - M.r}" y1="${y(v)}" y2="${y(v)}"/>

        i % step

function dayPanel(key, days) {

    );

    return `${head}<p class="mp">No trades on this day.</p></div>`;
    const n = e.closed.length;
    const wins = e.closed.filter((x) => x.res === 'Win').length;
    const losses = e.closed.filter((x) => x.res === 'Loss').length;
    const nets = e.closed.map((x) => x.net);
    const pips =
    Math.round(e.closed.reduce((t, x) => t + (x.pips ?? 0), 0) * 10) / 10;
    const comm = r2(e.closed.reduce((t, x) => t + x.t.comm, 0));

    const tone = (v, text) => `<span class="${cls(v)}">${text}</span>`;
    const kv = [
    ['Daily P&L', n ? tone(e.net, fm(e.net, 1)) : dash],
    ['Closed trades', n],
    ['Wins / losses', `${wins} / ${losses}`],
    ['Win rate', n ? ((wins / n) * 100).toFixed(1) + '%' : dash],
    ['Best trade', n ? tone(Math.max(...nets), fm(Math.max(...nets), 1)) : dash],
    ['Worst trade', n ? tone(Math.min(...nets), fm(Math.min(...nets), 1)) : dash],
    ['Total pips', n ? tone(pips, pips) : dash],
    ['Commission', n ? fm(comm) : dash],

    const open = e.open.length
    ? `<p class="sub" style="margin-top:12px">${e.open.length} trade${e.open.length > 1 ? 's' : ''}
        opened on this day ${e.open.length > 1 ? 'are' : 'is'} still open and not
        counted in the daily result.</p>`
    : '';

    .map(([k, v]) => `<div class="lbl">${k}<b>${v}</b></div>`)

    let regime = 0;

        const roll = rnd();
        if (roll < 0.07) return 'flat';
        return rnd() < (regime > 0 ? 0.68 : 0.30) ? 'win' : 'loss';
    };
    const make = (a, ago, open) => {
        const inst = pick(SAMPLE_PAIRS);
        const [, from, to] = pick(SAMPLE_SESSIONS);
        const dir = rnd() < 0.5 ? 1 : -1;
        const entry = +(inst.base * (1 + between(-0.01, 0.01))).toFixed(inst.dp);
        const slPips = Math.round(between(...inst.sl));
        const rr = +between(0.6, 5).toFixed(1);
        // Position sizes vary; rare oversized positions magnify both wins and losses.
        const sizeFactor = rnd() < 0.07 ? between(2.5, 5) : between(0.35, 1.8);
        const risk = r2(a.balance * a.risk * sizeFactor);
        const lots = Math.max(
            0.01,
            Math.round((risk / (slPips * inst.pv)) * 100) / 100,

            account: a.id,
            dt,

            side: dir > 0 ? 'Buy' : 'Sell',
            entry,
            sl: +(entry - dir * slPips * inst.pip).toFixed(inst.dp),
            tp: +(entry + dir * slPips * rr * inst.pip).toFixed(inst.dp),
            exit: null,
            lots,
            risk,
            pl: null,
            comm: 0,
            charges: 0,
            adjustment: 0,
            pipSize: inst.pip,
            session: detectSession(dt),
            setup: pick(SAMPLE_SETUPS),
            tf: pick(['M15', 'H1', 'H4']),
            notes: open ? 'Trade still running, stop is in place.' : '',
            psychologyBefore: pick(SAMPLE_EMOTIONS),
            psychologyAfter: '',
            planFollowed: rnd() < 0.76,
            mistakes: [],
            checklistDone: SAMPLE_CHECKLIST.filter(() => rnd() < 0.85),
            screenshots: n <= 4 || (n % 13 === 0) ? [SAMPLE_SCREENSHOTS[n % 2], SAMPLE_SCREENSHOTS[(n+1) % 2]] : [],
            sample: true,

            updated: stamp + n,

        if (!open) {

            const shock = rnd();

async function importFile(file) {
    if (!file) return;
    const fail = (m) => toast(m, 'error');
    if (file.size > 20 * 1024 * 1024)
    return fail('Import failed: file is larger than 20 MB.');
    let d;
    try {
    const txt = await file.text();
    if (!txt.trim()) return fail('Import failed: the file is empty.');
    d = JSON.parse(txt);
    } catch {
    return fail('Import failed: the file is not valid JSON.');
    }
    if (!d || d.app !== 'Pipfolio' || !Array.isArray(d.trades))
    return fail('Import failed: this is not a Pipfolio backup file.');
    const ok = d.trades.map(clean).filter(Boolean),
    skipped = d.trades.length - ok.length,
    dup = new Map();
    ok.forEach((t) => {
    const o = dup.get(t.id);
    if (!o || t.updated >= o.updated) dup.set(t.id, t);
    });
    if (d.trades.length && !dup.size)
    return fail(
        'Import failed: no valid trades were found in this file.',
    );
    const st = cleanSettings(d.settings),
    trades = norm([...dup.values()], st);
    const note = `${trades.length} trade${trades.length === 1
    ? '' : 's'} and ${st.accounts.length} account${st.accounts.length === 1
        ? '' : 's'} found${skipped ? `, ${skipped} invalid trade${skipped > 1
        ? 's' : ''} skipped` : ''}.`;
    const ch = await ask(
    'Import backup',
    `${note}<br><br><b>Merge</b> adds new accounts and trades and keeps your current
        data. <b>Replace</b> overwrites all accounts, trades and settings with the backup.`,
    [
        { label: 'Cancel', val: null },
        { label: 'Merge', val: 'm' },
        { label: 'Replace', cls: 'primary', val: 'r' },
    ],
    );
    if (!ch) return;
    if (ch === 'm') {
    const am = new Map(S.settings.accounts.map((a) => [a.id, a]));
    st.accounts.forEach((a) => am.has(a.id) || am.set(a.id, a));
    const ns = { ...S.settings, accounts: [...am.values()] },
        m = new Map(S.trades.map((t) => [t.id, t]));
    let add = 0,
        upd = 0;
    trades.forEach((t) => {
        const o = m.get(t.id);
        if (!o) {
        m.set(t.id, t);
        add++;
        } else if (t.updated > o.updated) {
        m.set(t.id, t);
        upd++;
        }
    });
    if (await commit(norm([...m.values()], ns), ns)) {
        toast(`Merged: ${add} added, ${upd} updated`);
        render();
    }
    return;
    }
    if (
    !(await confirmDel(
        'Replace all data?',
        'This overwrites every account, trade and setting in this ' +
        'profile. Export a backup first if you might need the current ' +
        'data.',
        'Replace data',
    ))
    )
    return;
    const restoredPreferences = cleanPreferences(d.preferences || {...preferences, theme:d.theme || preferences.theme});
    if (!(await commit(trades, st, restoredPreferences))) return;
    S.acc = S.tacc = 'all';
    toast('Backup restored to your account.');
    render();
}

function parseCsv(txt) {
    const rows = [];
    let row = [], cur = '', q = false;
    txt = txt.replace(/^\uFEFF/, '');
    for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) {
        if (c === '"') {
        if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false;
        } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
        if (c === '\r' && txt[i + 1] === '\n') i++;
        row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    if (q) return Object.assign([], { error: 'Unclosed quoted field in CSV.' });
    return rows.filter((r) => r.some((x) => x.trim() !== ''));
}
const csvDt = (s) => {
    const m = /^(\d{4}-\d\d-\d\d)[ T](\d\d:\d\d)/.exec(String(s).trim());
    return m ? m[1] + 'T' + m[2] : '';
};
function csvTrades(txt) {
    const rows = parseCsv(txt);
    if (rows.error) return { error: rows.error };
    if (rows.length < 2) return { error: 'The file has no data rows.' };
    const head = rows[0].map((h) => h.trim().toLowerCase().replace(/\s+/g, ' '));
    const cols = ['symbol', 'side', 'type', 'qty', 'avg fill price', 'status',
    'update time', 'position id', 'commission', 'closed p&l'];
    const miss = cols.filter((c) => head.indexOf(c) < 0);
    if (miss.length) return { error: 'Missing columns: ' + miss.join(', ') + '.' };
    const I = Object.fromEntries(cols.map((c) => [c, head.indexOf(c)]));
    // Only use explicitly labelled broker fee columns; never estimate missing fees.
    const feeCols = head.map((h, i) => /^(swap|swap fee|swap fees|financing|financing fee|financing fees|overnight fee|overnight fees|other fees|additional charges|transaction fee|transaction fees|exchange fee|exchange fees)$/.test(h) ? i : -1).filter((i) => i >= 0);
    const pos = new Map();
    const balanceCol = head.findIndex((h) => /^(account balance|balance after|running balance|ending balance)$/.test(h));
    const reportedBalances = [];
    const badFinancial = [];
    rows.slice(1).forEach((r) => {
    const g = (c) => (r[I[c]] ?? '').trim();
    const pid = g('position id');
    if (balanceCol >= 0 && String(r[balanceCol] ?? '').trim() !== '') {
        const b = Number(String(r[balanceCol]).replace(/[$, ]/g, ''));
        if (Number.isFinite(b)) reportedBalances.push({ time: csvDt(g('update time')), value: b });
    }
    if (g('status').toLowerCase() !== 'filled' || !pid) return;
    const o = {
        sym: g('symbol'), side: g('side'), type: g('type').toLowerCase(),
        qty: Number(g('qty')), price: Number(g('avg fill price')),
        time: csvDt(g('update time')), comm: Math.abs(Number(g('commission')) || 0),
        charges: r2(feeCols.reduce((sum, i) => sum + Math.abs(Number(r[i]) || 0), 0)),
        pl: g('closed p&l'), netPl: head.includes('net closed p&l') ? (r[head.indexOf('net closed p&l')] ?? '').trim() : '',
    };
    if (o.pl !== '' && (!Number.isFinite(Number(o.pl)) || (o.netPl !== '' && !Number.isFinite(Number(o.netPl))))) {
        badFinancial.push(pid); return;
    }
    if (!pos.has(pid)) pos.set(pid, { entries: [], exits: [] });
    pos.get(pid)[o.pl !== '' ? 'exits' : 'entries'].push(o);
    });
    if (badFinancial.length) return { error: 'Invalid broker P&L values for position(s): ' + [...new Set(badFinancial)].join(', ') };
    const wavg = (a) =>
    +(a.reduce((s, x) => s + x.price * x.qty, 0) /
        a.reduce((s, x) => s + x.qty, 0)).toFixed(5);
    const out = [];
    let skipped = 0, stamp = Date.now();
    for (const [pid, p] of pos) {
    if (!p.entries.length) { skipped++; continue; } // opened before this export
    const byTime = (a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
    p.entries.sort(byTime); p.exits.sort(byTime);
    const e0 = p.entries[0];
    const lots = r2(p.entries.reduce((s, x) => s + x.qty, 0));
    const entry = wavg(p.entries);
    const d = e0.side === 'Buy' ? 1 : -1;
    const exitQty = p.exits.reduce((s, x) => s + x.qty, 0);
    const done = p.exits.length && exitQty >= lots - 1e-9; // partial close stays open
    const t = {
        id: 'csv-' + pid, account: '', dt: e0.time, xdt: '',
        pair: e0.sym.split('.')[0].toUpperCase(), side: e0.side,
        entry, sl: null, tp: null, exit: null, lots, risk: 0, pl: null,
        comm: r2(p.entries.reduce((s, x) => s + x.comm, 0)),
        charges: r2(p.entries.reduce((s, x) => s + x.charges, 0)),
        adjustment: 0,
        pipSize: null, session: detectSession(e0.time), setup: '', tf: '',
        notes: 'Imported from broker CSV (' + pid + ')',
        created: stamp, updated: stamp++,
    };
    if (done) {
        const last = p.exits[p.exits.length - 1];
        t.exit = wavg(p.exits);
        t.xdt = last.time;
        t.pl = r2(p.exits.reduce((s, x) => s + Number(x.pl), 0));
        t.comm = r2(t.comm + p.exits.reduce((s, x) => s + x.comm, 0));
        t.charges = r2(t.charges + p.exits.reduce((s, x) => s + x.charges, 0));
        // TradingView net includes broker adjustments not itemized as commission.
        // Preserve the reported net rather than inventing a fee.
        if (p.exits.every((x) => x.netPl !== '' && Number.isFinite(Number(x.netPl)))) {
            const reportedNet = r2(p.exits.reduce((s, x) => s + Number(x.netPl), 0));
            t.adjustment = r2(reportedNet - (t.pl - t.comm - t.charges));
        }
        if (last.type.includes('stop') && d * (entry - t.exit) > 0) t.sl = t.exit;
        if (last.type.includes('take') && d * (t.exit - entry) > 0) t.tp = t.exit;
    }
    const c = clean(t);
    c ? out.push(c) : skipped++;
    }
    reportedBalances.sort((a, b) => a.time.localeCompare(b.time));
    return { trades: out, skipped, reportedBalance: reportedBalances.length ? reportedBalances[reportedBalances.length - 1].value : null }; 
}
async function importCsv(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024)
    return toast('CSV import failed: file is larger than 5 MB.', 'error');
    let res;
    try { res = csvTrades(await file.text()); }
    catch { return toast('CSV import failed: unable to read the file.', 'error'); }
    if (res.error) return toast('CSV import failed: ' + res.error, 'error');
    const have = new Set(S.trades.map((t) => t.id));
    const fresh = res.trades.filter((t) => {
        if (have.has(t.id)) return false;
        have.add(t.id);
        return true;
    });
    const dup = res.trades.length - fresh.length;
    if (!fresh.length)
    return toast(dup ? 'These trades are already imported.' : 'No trades found in this CSV.', 'error');
    const def = acc(S.lastAcc) ? S.lastAcc : S.settings.accounts[0].id;
    const balanceNotice = res.reportedBalance == null
        ? 'No broker account balance column detected. Existing starting balance will be kept.'
        : 'Broker-reported ending balance: ' + fm(res.reportedBalance, false, '') + '. You may reconcile the account balance using this value.';
    openDlg(
    `<div class="dh"><h2>Import Broker CSV</h2></div><div class="db">
        <p class="mp" style="margin-bottom:16px">${fresh.length} new trade${fresh.length > 1 ? 's' : ''} found${dup ? `, ${dup} already imported` : ''}${res.skipped ? `, ${res.skipped} skipped` : ''}.</p>
        <p class="mp" style="margin-bottom:12px">${esc(balanceNotice)}</p>
        <label class="f"><span>Import into account</span><select id="csvacc">${S.settings.accounts
        .map((a) => `<option value="${esc(a.id)}" ${a.id === def ? 'selected' : ''}>${esc(a.name)} (${a.type})</option>`)
        .join('')}</select></label>
        ${res.reportedBalance == null ? '' : '<label style="display:block;margin-top:12px"><input type="checkbox" id="csvbalance" style="width:auto;height:auto"> Reconcile account to broker-reported balance (only if this is the latest balance)</label>'}</div>
        <div class="df"><button class="btn" data-act="close">Cancel</button>
        <button class="btn primary" id="csvgo">Import</button></div>`,
    'sm',
    );
    $('#csvgo').onclick = async () => {
    const a = $('#csvacc').value;
    const updatedTrades = [...S.trades, ...fresh.map((t) => ({ ...t, account: a }))];
    let settings = S.settings;
    if (res.reportedBalance != null && $('#csvbalance')?.checked) {
        const accountNet = r2(updatedTrades.filter((t) => t.account === a && closed(t)).reduce((sum, t) => sum + calc(t).net, 0));
        settings = { ...S.settings, accounts: S.settings.accounts.map((x) => x.id === a
            ? { ...x, balance: r2(res.reportedBalance - accountNet - flowNet(x)) } : x) };
        if (settings.accounts.some((x) => x.id === a && x.balance < 0))
            return toast('Reconciliation would require a negative starting balance. Check account history.', 'error');
    }
    if (await commit(updatedTrades, settings)) {
        S.lastAcc = a;
        closeDlg();
        toast(`Imported ${fresh.length} trade${fresh.length > 1 ? 's' : ''}`);
        render();
    }
    };
}

    ${F('date', 'Date', `<input name="date" type="date" value="${nowLocal().slice(0, 10)}">`)}
    ${F('amount', 'Amount (' + esc(a.currency) + ')', nin('amount', '', '0.00'))}
    <div class="full">${F('note', 'Note (optional)', `<input name="note" maxlength="100" placeholder="e.g. Monthly top-up">`)}</div>
    </div></div><div class="df"><button type="button" class="btn" data-act="close">Cancel</button>
    <button class="btn primary">Save ${type.toLowerCase()}</button></div></form>`,
    'sm',
    );
    $('#ff').onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target),
        g = (n) => String(f.get(n) || '').trim(),
        er = {},
        amt = Number(g('amount'));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g('date')) || Number.isNaN(Date.parse(g('date')))) er.date = 'Enter a valid date';
    if (g('amount') === '') er.amount = 'Required';
    else if (!Number.isFinite(amt) || amt <= 0) er.amount = 'Must be greater than 0';
    showErrs(ev.target, er);
    if (Object.keys(er).length) return;
    const flow = { id: uid(), type, date: g('date'), amount: amt, note: g('note').slice(0, 100) };
    const st = {
        ...S.settings, accounts: S.settings.accounts.map((x) =>
        x.id === id ? { ...x, flows: [...(x.flows || []), flow] } : x,
        ),
    };
    if (await commit(S.trades, st)) {
        closeDlg();
        toast(type + ' added');
        render();
    }
    };
}
/* ---------- actions ---------- */
const act = {
    view: (d) => {
    S.view = d.v;
    render();
    },
    theme: async () => {
        if(await commit(S.trades, S.settings, {...preferences,
            theme:preferences.theme === 'dark' ? 'light' : 'dark'})) render();
    },
    accent: async (d) => {
        if(await commit(S.trades, S.settings, {...preferences,accent:d.color})) render();
    },
    savequote: async () => {
        const quote=($('#custom-dashboard-quote')?.value || '').trim();
        if(!quote) return toast('Enter a quote first.', 'error');
        if(await commit(S.trades, S.settings, {...preferences,quote})) {
            render(); toast('Dashboard quote saved');
        }
    },
    resetquote: async () => {
        if(await commit(S.trades, S.settings, {...preferences,quote:''})) render();
    },
    lock: signOut,
    reload: async () => {if(currentUser && !saving) await loadAccount(currentUser,true);},
    riskcalc: () => riskCalculator(),
    savechecklist: async () => {const val=($('#checklist-editor')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20);const next={...S.settings,checklist:val};if(await commit(S.trades,next)){toast('Checklist saved');render();}},
    add: () => tradeForm(),
    close: closeDlg,
    detail: (d) => detail(d.id),
    edit: (d) => tradeForm(S.trades.find((t) => t.id === d.id)),
    del: async (d) => {
    const t = S.trades.find((x) => x.id === d.id);
    if (!t) return;
    if (
        (await confirmDel(
        'Delete this trade?',
        `${esc(t.pair)} ${t.side} on ${t.dt.replace('T',
            ' ')} will be permanently deleted.`,
        'Delete trade',
        )) &&
        await commit(S.trades.filter((x) => x.id !== d.id))
    ) {
        toast('Trade deleted');
        render();
    }
    },
    accadd: () => accForm(),
    flowadd: (d) => flowForm(d.id, d.t),
    flowdel: async (d) => {
    if (
        await confirmDel(
        'Delete this entry?',
        'This deposit or withdrawal will be permanently removed.',
        'Delete',
        )
    ) {
        const st = {
        ...S.settings, accounts: S.settings.accounts.map((x) =>
            x.id === d.id
            ? { ...x, flows: (x.flows || []).filter((f) => f.id !== d.fid) }
            : x,
        ),
        };
        if (await commit(S.trades, st)) {
        toast('Entry deleted');
        render();
        }
    }
    },
    accedit: (d) => accForm(acc(d.id)),
    accview: (d) => {
    S.acc = d.id;
    S.view = 'dashboard';
    render();
    },
    accdel: async (d) => {
    const a = acc(d.id);
    if (!a) return;
    if (S.settings.accounts.length < 2)
        return toast(
        'Keep at least one account. Add another before deleting this one.',
        'error',
        );
    const n = S.trades.filter((t) => t.account === d.id).length;
    if (
        await confirmDel(
        'Delete this account?',
        `${esc(a.name)} will be deleted${n ? ` along with its ${n} trade${n > 1
            ? 's' : ''}` : ''}. This cannot be undone. Export a backup first if you might
            need it.`,
        'Delete account',
        )
    ) {
        const st = {
        ...S.settings, accounts: S.settings.accounts.filter((x) => x.id !== d.id),
        };
        if (
        await commit(
            S.trades.filter((t) => t.account !== d.id),
            st,
        )
        ) {
        if (S.acc === d.id) S.acc = 'all';
        if (S.tacc === d.id) S.tacc = 'all';
        toast('Account deleted');
        render();
        }
    }
    },
    exit: (d) =>
    tradeForm(
        S.trades.find((t) => t.id === d.id),
        'xd',
    ),
    calprev: () => calGo(S.cal.y, S.cal.m - 1),
    calnext: () => calGo(S.cal.y, S.cal.m + 1),
    calprevy: () => calGo(S.cal.y - 1, S.cal.m),
    calnexty: () => calGo(S.cal.y + 1, S.cal.m),
    caltoday: () => {
    const now = nowLocal();
    calGo(+now.slice(0, 4), +now.slice(5, 7) - 1);
    },
    calday: (d) => {
    S.calDay = S.calDay === d.d ? '' : d.d;
    refreshCal();
    },
                sampleadd: async () => {
    const sample = buildSample();
    const st = { ...S.settings, accounts: [...S.settings.accounts, ...sample.accounts],
        checklist: (S.settings.checklist || []).length ? S.settings.checklist : [...SAMPLE_CHECKLIST] };
    if (await commit([...S.trades, ...sample.trades], st)) {
        toast(
        `Sample data added: ${sample.trades.length} trades` +
            (sample.accounts.length ? `, ${sample.accounts.length} accounts` : ''),
        );
        render();
    }
    },
    sampledel: async () => {
    const info = sampleInfo();
    if (!info.accounts && !info.trades)
        return toast('There is no sample data to remove.', 'error');
    const ok = await confirmDel(
        'Remove sample data?',
        `This removes ${info.trades} sample trade${info.trades === 1 ? '' : 's'} and ` +
        `${info.accounts} sample account${info.accounts === 1 ? '' : 's'}. ` +
        'Your own accounts and trades are not affected, and any sample ' +
        'account that holds your own trades is kept.',
        'Remove sample data',
    );
    if (!ok) return;
    const trades = S.trades.filter((t) => !t.sample);
    const used = new Set(trades.map((t) => t.account));
                const accounts = S.settings.accounts.flatMap((a) =>
        !a.sample
        ? [a]
        : used.has(a.id) || (a.flows || []).length
            ? [{ ...a, sample: false }]
            : [],
    );
    if (await commit(trades, cleanSettings({ ...S.settings, accounts }))) {
        if (S.acc !== 'all' && !acc(S.acc)) S.acc = 'all';
        if (S.tacc !== 'all' && !acc(S.tacc)) S.tacc = 'all';
        S.calDay = '';
        toast('Sample data removed');
        render();
    }
    },
    export: exportData,
    import: () => {
    S.importMode = 'main';
    $('#file').click();
    },
    erase: async () => {
        if(await confirmDel('Erase your journal?',
            'This deletes all trades, trading accounts, screenshots and settings from your Supabase profile on every device. Your login stays active. Export a backup first.',
            'Erase journal')) {
            if(await commit([], cleanSettings(), defaultPreferences())) {
                closeDlg(); S.acc = S.tacc = 'all'; render(); toast('Journal erased');
            }
        }
    },
    chpw: () => authScreen('update'),

};
document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (a && act[a.dataset.act] && ready && !saving) Promise.resolve(act[a.dataset.act](a.dataset)).catch(error=>toast(error.message,'error'));
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('tr[data-act]'))
    act.detail(e.target.dataset);
});
document.addEventListener('input', (e) => {
    const i = e.target.id;
    if (i === 'q' || i === 'res' || i === 'tacc') {
    S.q = $('#q').value;
    S.res = $('#res').value;
    S.tacc = $('#tacc').value;
    $('#tl').innerHTML = tradeTable(tfilter(), S.trades.length);
    }
    if (i === 'accf') {
    S.acc = e.target.value;
    render();
    }
});
document.addEventListener('change', (e) => {
    if (e.target.id !== 'cm' && e.target.id !== 'cy') return;
    const y = Number($('#cy').value);
    const m = Number($('#cm').value);
    if (Number.isInteger(y) && y >= CAL_MIN && y <= CAL_MAX) calGo(y, m);
    else {
    toast(`Enter a year between ${CAL_MIN} and ${CAL_MAX}.`, 'error');
    refreshCal();
    }
});
$('#file').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const isCsv = /\.csv$/i.test(f.name) || f.type === 'text/csv';
    if (isCsv && S.importMode !== 'setup') await importCsv(f);
    else await importFile(f);
};

function addCardInfo(){
 const root=document.querySelector('#app');if(!root)return;
 root.querySelectorAll('.card, .ref-card, .acc').forEach(card=>{
   if(card.matches('.tw') && card.querySelector('table'))return;
   if(card.closest('.lock'))return;
   if(card.matches('.acc') && card.querySelector('.account-type-info'))return;
   if(card.querySelector(':scope > .card-info-floating'))return;
   const titleEl=card.querySelector('.simple-panel-title h2, .ref-title, .cal-h h2, .page-h h2, :scope > h2, :scope > h3, .acc-h h2, .acc-h h3, .simple-label');
   const raw=(titleEl?.textContent||'').replace(/\s+/g,' ').trim();
   const title=raw|| (card.matches('.acc')?'Trading Account':card.querySelector('table')?'Trades Table':'Journal Card');
   const key=title.toLowerCase().replace(/\s+/g,' ').trim();
   const desc=cardHelpDescriptions[key] || (card.querySelector('table')?'Lists recorded trades and their details. Use the available controls to inspect or manage entries.':card.matches('.acc')?'Displays the account details and related controls for this trading account.':`Explains the ${title.toLowerCase()} section and the trading information shown in this card.`);
   // Do not duplicate the existing circular information control on metric cards or the calendar.
   if(titleEl?.closest('.simple-stat-head')?.querySelector('.info-button') || titleEl?.querySelector('.info-button') || (titleEl?.parentElement?.querySelector('.info-button')))return;
   const b=document.createElement('button');b.type='button';b.className='info-button chart-pop-target card-info-button';b.textContent='i';
   b.setAttribute('aria-label','About '+title);b.setAttribute('data-chart-title',title);b.setAttribute('data-chart-detail',desc);
   if(titleEl){
     const slot=document.createElement('span');slot.className='card-info-inline';slot.appendChild(b);titleEl.appendChild(slot);
   }else{
     card.classList.add('card-info-positioned');
     const slot=document.createElement('span');slot.className='card-info-floating';slot.appendChild(b);card.appendChild(slot);
   }
 });
}
let cardInfoQueued=false;
const cardInfoObserver=new MutationObserver(()=>{
 if(cardInfoQueued)return;cardInfoQueued=true;
 queueMicrotask(()=>{cardInfoQueued=false;addCardInfo();});
});
cardInfoObserver.observe(document.getElementById('app'),{childList:true,subtree:true});
addCardInfo();

window.addEventListener('beforeunload',event=>{if(saving){event.preventDefault();event.returnValue='';}});
